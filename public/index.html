// displayPositionsは「実際に画面に表示してよい」と明示的に確定した位置のみを保持する、
// ただ一つの信頼できる情報源(single source of truth)。
// サーバーから来た生のroom.players[].positionを直接描画に使うことは絶対にしない。
// 各プレイヤーの位置は、そのプレイヤーの移動アニメーションが実際に進行/完了した
// タイミングでのみ更新される（animateTokenMove内、または戦闘後退などの明示的な更新箇所）。
let displayPositions={};

function currentDisplayOverrides(){
  const o={...displayPositions};
  if(tokenAnim) o[tokenAnim.playerId]=tokenAnim.current;
  return o;
}

// 明示的に「このプレイヤーは今この位置にいることが確定した」と印をつける。
// アニメーション完了時や、戦闘後退のように瞬間的な位置変化の直後にのみ呼ぶこと。
function commitDisplayPosition(playerId,pos){
  if(pos==null) return;
  displayPositions[playerId]=pos;
}

// displayPositionsに未登録のプレイヤー（新規参加者など）だけを、
// サーバーの現在位置で安全に初期化する（既存プレイヤーの値は絶対に上書きしない）。
function ensureDisplayPositionsInit(r){
  if(!r||!r.players) return;
  r.players.forEach(p=>{
    if(displayPositions[p.id]===undefined) displayPositions[p.id]=p.position;
  });
}

function renderGameMapOnly(r){
  ensureDisplayPositionsInit(r);
  drawMap($('mapCanvas'),r,currentDisplayOverrides());
}

// 選べる行動が何も残っていない場合、自動的にターンを終了する。
// アニメーション中は待ち、二重送信しないようフラグで制御する。
let autoEndTimer=null;
let autoEndArmed=false;   // このターンで自動終了を送信済みか
function resetAutoEnd(){ clearTimeout(autoEndTimer); autoEndArmed=false; }
function maybeAutoEndTurn(){
  if(autoEndArmed) return;
  if(!currentRoom||currentRoom.phase!=='playing') return;
  const me=currentRoom.players.find(p=>p.id===myId);
  if(!me||currentRoom.currentTurnId!==myId||!me.actionTaken) return;
  clearTimeout(autoEndTimer);
  autoEndTimer=setTimeout(()=>{
    // 演出やパス上戦闘の選択が終わるまで待つ
    if(animBusy||pathBattleUI||tokenAnim){ autoEndTimer=setTimeout(maybeAutoEndTurn,600); return; }
    const now=currentRoom&&currentRoom.players.find(p=>p.id===myId);
    if(!now||currentRoom.currentTurnId!==myId||!now.actionTaken) return;
    autoEndArmed=true;
    socket.emit('endTurn');
  },900);
}

  renderGameMapOnly(r);
  // left column — player cards（手番順に並べる。マップ移行で順番が入れ替わった場合も追従する）
  const left=$('colLeft');left.innerHTML='';
  const orderedPlayers=(r.turnOrder&&r.turnOrder.length)
    ? r.turnOrder.map(id=>r.players.find(p=>p.id===id)).filter(Boolean)
    : r.players;
  orderedPlayers.forEach(p=>{
    const d=document.createElement('div');
    d.className='p-card'+(p.id===r.currentTurnId?' turn-now':'');
    d.dataset.playerId=p.id;
    let badges='';
    if(p.id===r.currentTurnId) badges+='<span class="tb">手番</span>';
    if(p.incapacitatedTurns>0) badges+='<span class="db">不能('+p.incapacitatedTurns+')</span>';
    const roleImgSrc=p.roleId&&ROLE_ICON[p.roleId]?'/img/'+ROLE_ICON[p.roleId]+'.png':'';
    const roleImgTag=roleImgSrc?'<img class="p-card-img" src="'+roleImgSrc+'">':'';
    d.innerHTML='<div class="p-name">'+roleImgTag+'<span class="p-dot" style="background:'+p.color+'"></span>'+(p.id===myId?'<b class="me">'+p.name+'</b>':p.name)+badges+'</div>'
      +'<div class="sr"><span class="role-tip" data-tip="'+escHtml(getRoleDesc(p.roleName,r))+'">'+p.roleName+'</span>'
      +(p.id===myId?' / '+(p.powers.map(pw=>pw.name==='???'?pw.name:(pw.locked?'<span style="color:var(--dim);">'+pw.name+'(未解放)</span>':'<span class="role-tip" data-tip="'+escHtml(pw.description+'\nコスト: PSY '+pw.cost+' ['+timingLabel(pw.timing)+']')+'">'+pw.name+(pw.evolved?' ★':'')+'</span>')).join(', ')||'-'):' / ???')+'</div>'
      +'<div class="sr hp-row-val">HP '+p.hp+'/'+p.maxHp+'</div>'+bar(p.hp,p.maxHp,'bar-hp')
      +'<div class="sr en-row-val">PSY '+p.energy+'/'+p.maxEnergy+'</div>'+bar(p.energy,p.maxEnergy,'bar-en')
      +'<div class="sr" style="color:var(--gold);">Lv.'+(p.level||0)+' EXP '+(p.xp||0)+'/'+(p.xpToNext||80)+'</div>'+barXP(p.xp||0,p.xpToNext||80);
    left.appendChild(d);
  });
  $('roundLabel').textContent=r.roundNumber;
  $('mapLabel').textContent=(r.mapName||'')+' ('+(r.currentMapIndex||1)+'/'+(r.totalMaps||4)+')';
  renderRankBoard(r);
  renderNextTurn(r);
  // right column — controls
  const isMyTurn=r.currentTurnId===myId;
  if(!isMyTurn){ resetAutoEnd(); $('abilityPanel').classList.remove('open'); }
  $('myTurnControls').style.display=isMyTurn?'block':'none';
  if(isMyTurn){
    const me=r.players.find(p=>p.id===myId);
    const acted=me.actionTaken;
    // ボタン表示制御
    $('rollBtn').style.display=acted?'none':'block';
    $('restBtn').style.display=acted?'none':'block';
    $('endTurnBtn').style.display=(acted&&!pathBattleUI)?'block':'none';
    // 奇術師のトリプルダイスボタン
    $('tripleDiceBtn').style.display=(!acted&&me.canTripleDice)?'block':'none';
    // 超能力パネル更新
    const ap=$('abilityPanelInner');ap.innerHTML='';
    let anyUsable=false;
    // ヘッダー（タイトル・残PSY・閉じる）
    const head=document.createElement('div');
    head.className='ap-head';
    head.innerHTML='<span class="ap-title">超能力を使う</span>'
      +'<span class="ap-psy">PSY '+(me?me.energy:0)+' / '+(me?me.maxEnergy:0)+'</span>';
    const closeBtn=document.createElement('button');
    closeBtn.className='ap-close';closeBtn.textContent='✕';
    closeBtn.onclick=()=>{$('abilityPanel').classList.remove('open');};
    head.appendChild(closeBtn);
    ap.appendChild(head);
    if(me&&me.powers){
      const usedT=me.usedTimings||[];
      me.powers.forEach(pw=>{
        if(pw.locked||pw.type==='counter'||pw.timing==='battle') return; // 未解放・カウンター型・戦闘型は別UIで扱う
        const timingOk=(pw.timing==='anytime')||(pw.timing==='beforeMove'&&!acted);
        const canUse=me.energy>=pw.cost && timingOk && !usedT.includes(pw.timing);
        if(!canUse) return; // 使えない能力は表示しない
        anyUsable=true;
        const card=document.createElement('div');
        card.className='ab-card';
        let tags='';
        if(pw.evolved) tags+='<span class="ab-tag evo">進化済</span>';
        if(pw.isCopy) tags+='<span class="ab-tag copy">コピー</span>';
        card.innerHTML='<div class="ab-top"><span class="ab-name">'+escHtml(pw.name)+'</span>'
          +'<span class="ab-cost">PSY '+pw.cost+'</span>'
          +'<span class="ab-timing">'+timingLabel(pw.timing)+'</span>'+tags+'</div>'
          +'<div class="ab-desc">'+escHtml(pw.description)+'</div>';
        card.onclick=()=>{
          sfxAbilityPick();sfxMagic();
          $('abilityPanel').classList.remove('open');
          if(pw.requiresTarget){
            showTargetPicker(pw);
          } else if(pw.requiresHistoryChoice){
            showCopyPicker(pw);
          } else {
            socket.emit('useAbility',{powerId:pw.lineId});
          }
        };
        ap.appendChild(card);
      });
    }
    if(!anyUsable){
      const em=document.createElement('div');
      em.className='ap-empty';
      em.textContent='いま使える超能力はありません';
      ap.appendChild(em);
    }
    // 超能力ボタンは常に表示、使える超能力がある場合は発光
    $('abilityBtn').style.display='block';
    $('abilityBtn').classList.toggle('ability-glow',anyUsable);
    $('abilityBtn').disabled=!anyUsable;
    // 戦闘ボタン: パス上戦闘UI表示中はそちらを優先
    if(!pathBattleUI){
      const others=acted&&me.position>0&&!me.battleDoneThisTurn&&!me.pendingMoveTotal
        ? r.players.filter(p=>p.id!==myId&&p.position===me.position&&!p.finished&&p.incapacitatedTurns===0)
        : [];
      const bt=$('battleTargets');bt.innerHTML='';
      others.forEach(o=>{const b=document.createElement('button');b.className='dan';b.textContent=o.name+'に戦闘を仕掛ける';
        b.onclick=()=>{socket.emit('proposeBattle',{opponentId:o.id});};
        bt.appendChild(b);});
      // 行動済みで、超能力も戦闘も選べないなら自動でターンを終了する
      if(acted&&!anyUsable&&others.length===0){
        maybeAutoEndTurn();
      }
    }
  }
  const lg=$('log');lg.innerHTML=r.log.map(l=>'<div>'+l+'</div>').join('');lg.scrollTop=lg.scrollHeight;
}

/* ===== 超能力覚醒前の演出（暗闇に雫が落ちる） ===== */
const AWAKEN_MS=6300;
function showAwaken(onDone){
  const sc=$('awakenScreen'),stage=$('awStage');
  // 前回の粒子を消してから作り直す（アニメーションを再生し直すため）
  stage.querySelectorAll('.aw-mote').forEach(e=>e.remove());
  for(let i=0;i<18;i++){
    const m=document.createElement('div');
    m.className='aw-mote';
    m.style.left=(50+(Math.random()*46-23))+'%';
    const dur=(1.6+Math.random()*1.1).toFixed(2);
    const delay=(2.5+Math.random()*0.9).toFixed(2);
    m.style.animation='aw-mote '+dur+'s ease-out '+delay+'s forwards';
    stage.appendChild(m);
  }
  // CSSアニメーションを最初から再生させる
  sc.style.display='none';void sc.offsetWidth;
  sc.style.display='flex';
  setTimeout(()=>{
    sc.style.display='none';
    if(onDone)onDone();
  },AWAKEN_MS);
}

  else if(id==='roles') c.innerHTML=buildGuideRoles();
  else if(id==='powers') c.innerHTML=buildGuidePowers();
  else if(id==='monsters') c.innerHTML=buildGuideMonsters();
  else if(id==='disasters') c.innerHTML=buildGuideDisasters();

}

// 役職のパッシブからステータス表と特殊効果テキストを組み立てる
function buildRoleStats(p,constants){
  const baseHp=constants.baseMaxHp||10, baseEn=constants.baseMaxEnergy||6, baseDmg=constants.battleDamage||3;
  const st=[];
  const row=(k,v,cls)=>{st.push('<div class="rl-stat"><span class="rl-k">'+k+'</span><span class="rl-v '+cls+'">'+v+'</span></div>');};
  // HP上限
  const hp=baseHp+(p.maxHpBonus||0);
  row('HP上限',hp+(p.maxHpBonus?' (+'+p.maxHpBonus+')':''),p.maxHpBonus?'up':'norm');
  // PSY上限
  const en=baseEn+(p.maxEnergyBonus||0);
  row('PSY上限',en+(p.maxEnergyBonus?' (+'+p.maxEnergyBonus+')':''),p.maxEnergyBonus?'up':'norm');
  // ターン回復
  row('HP回復/ターン',(1+(p.hpRegenBonus||0)),p.hpRegenBonus?'up':'norm');
  row('PSY回復/ターン',(1+(p.energyRegenBonus||0)),p.energyRegenBonus?'up':'norm');
  // 与ダメージ
  const dmg=baseDmg+(p.battleDamageBonus||0);
  row('与ダメージ',dmg+(p.battleDamageBonus?' (+'+p.battleDamageBonus+')':''),p.battleDamageBonus?'up':'norm');

  // ステータス表に載せない効果は、すべて文章で個別に説明する
  const sp=[];
  if(p.moveDiceBonus) sp.push('<b>健脚</b> — 移動時のサイコロの目が+'+p.moveDiceBonus+'される');
  const atk=(p.battleDiceBonus||0)+(p.attackDiceBonus||0);
  const def=(p.battleDiceBonus||0)+(p.defendDiceBonus||0)-(p.defendDicePenalty||0);
  if(atk||def){
    if(atk===def&&atk>0) sp.push('<b>戦巧者</b> — 戦闘時のサイコロの目が+'+atk+'される');
    else{
      if(atk>0) sp.push('<b>先制の勘</b> — 自分から戦闘を仕掛けた時、サイコロの目が+'+atk+'される');
      if(def>0) sp.push('<b>迎撃の構え</b> — 相手から戦闘を仕掛けられた時、サイコロの目が+'+def+'される');
      if(def<0) sp.push('<b>守りの薄さ</b> — 相手から戦闘を仕掛けられた時、サイコロの目が'+def+'される');
    }
  }
  if(p.battleDamageReduction) sp.push('<b>頑健</b> — 戦闘で受けるダメージが'+p.battleDamageReduction+'軽減される');
  if(p.xpMultiplier) sp.push('<b>探究心</b> — 獲得する経験値が'+p.xpMultiplier+'倍になる（端数切り上げ）');
  if(p.badEventResist) sp.push('<b>危険回避</b> — マスの不利な効果とモンスター遭遇を50%の確率で回避する');
  if(p.rerollPerTurn) sp.push('<b>振り直し</b> — 1ターンに1回、サイコロを振り直せる');
  if(p.tripleDicePerMap) sp.push('<b>三連ダイス</b> — 1マップに1回、サイコロを3個同時に振れる');
  if(p.gamblerEffect) sp.push('<b>賭博の性</b> — 出目が奇数なら-3、偶数なら+3される');
  return {statsHtml:'<div class="rl-stats">'+st.join('')+'</div>',
          specialHtml:sp.length?('<div class="rl-special">'+sp.join('<br>')+'</div>'):''};
}

function buildGuideRoles(){
  let h='<h3 class="gd-sec-title">役職</h3><p class="gd-sec-lead">ゲーム開始時に選ぶ8種類の役職。基礎値はHP'+guideData.constants.baseMaxHp+'／PSY'+guideData.constants.baseMaxEnergy+'／与ダメージ'+guideData.constants.battleDamage+'で、役職ごとに補正がかかります。</p>';

let seenRoleSelect=false;
let seenPowerReveal=false;

socket.on('roomUpdate',r=>{
  currentRoom=r;
  // ロビーに入った時点でタイトル/ホーム/入力画面は閉じる
  $('titleScreen').style.display='none';
  $('homeScreen').style.display='none';
  $('guideScreen').style.display='none';
  $('entry').style.display='none';

  // 役職選択に初めて進むタイミングでロード画面を挟む
  if(r.phase==='roleSelect'&&!seenRoleSelect){
    seenRoleSelect=true;
    $('lobby').style.display='none';
    showLoading(2600,()=>{ applyRoomState(r); });
    return;
  }
  // 超能力が覚醒するタイミングで、暗闇に雫が落ちる演出を挟む
  if(r.phase==='powerReveal'&&!seenPowerReveal){
    seenPowerReveal=true;
    $('roleSelect').style.display='none';
    setScreenBg(false);
    showAwaken(()=>{ applyRoomState(r); });
    return;
  }
  applyRoomState(r);
});

function applyRoomState(r){
  $('lobby').style.display=r.phase==='lobby'?'block':'none';
  $('roleSelect').style.display=r.phase==='roleSelect'?'block':'none';
  $('powerReveal').style.display=r.phase==='powerReveal'?'block':'none';
  $('game').style.display=(r.phase==='playing'||r.phase==='finished')?'grid':'none';
  $('finished').style.display=r.phase==='finished'?'flex':'none';
  const inGame=(r.phase==='playing'||r.phase==='finished');
  // ロビー〜超能力確認の各画面では、ホーム画面と同じ演出の背景を表示する
  // ゲーム中も同じ背景を薄く表示し、画面全体の統一感を保つ
  setScreenBg(true,inGame);
  document.querySelector('.wrap').classList.toggle('in-game',inGame);
  // :has()未対応ブラウザでも背景演出が見えるようにする
  document.body.style.background=inGame?'transparent':'';
  // 盤面の常時アニメーション（脈動・炎・発光）はゲーム中だけ回す
  if(inGame) startBoardLoop(); else stopBoardLoop();
  $('topBar').classList.add('hidden');
  $('roomIdLabel').textContent=r.id;
  if(r.phase==='lobby') renderLobby(r);
  if(r.phase==='roleSelect') renderRoleSelect(r);
  if(r.phase==='powerReveal') renderPowerReveal(r);
  if(r.phase==='playing'||r.phase==='finished'){
    if(animBusy){
      // アニメーション中はマップのみ更新、ステータスは保留
      pendingRoomState=r;
      renderGameMapOnly(r);
    } else {
      renderGame(r);
    }
  }
  if(r.phase==='finished'){const w=r.players.find(p=>p.id===r.winnerId);$('winnerMsg').textContent=w?w.name+' の勝利です！':'';sfxVictory();}
}

/* ======== UNIFIED ANIMATION QUEUE ======== */
let animQueue=[];
let animBusy=false;
let tokenAnim=null;

function queueAnim(fn){animQueue.push(fn);if(!animBusy) runNextAnim();}
function runNextAnim(){
  if(animQueue.length===0){
    animBusy=false;
    // キュー完了時に保留していた最新状態を反映
    if(pendingRoomState){renderGame(pendingRoomState);pendingRoomState=null;}
    // HP/PSYバーは全アニメーションが終わったこの時点でまとめて更新する
    if(currentRoom&&currentRoom.players){
      currentRoom.players.forEach(p=>refreshPlayerCard(p.id));
    }
    return;
  }
  animBusy=true;
  const fn=animQueue.shift();
  let advanced=false;
  const advance=()=>{
    if(advanced)return; // 二重呼び出し防止
    advanced=true;
    clearTimeout(watchdog);
    animBusy=false;
    runNextAnim();
  };
  // ウォッチドッグ: 万一アニメーションが完了コールバックを呼ばない場合に
  // キューが永久停止しないよう、最大15秒で強制的に次へ進める
  const watchdog=setTimeout(()=>{
    console.error('[animQueue] watchdog timeout — forcing advance');
    // 開いたままの可能性があるオーバーレイを強制的に閉じる
    ['diceOverlay','battleOverlay','hpEffectOverlay','abilityActivationOverlay','battleChoiceModal','counterChoiceModal','turnBanner','myTurnBanner','lvUpBanner','eventBanner','disasterBanner','foresightBanner','disasterDiceOverlay','mapTransitionBanner','monsterBattleOverlay','monsterChoiceModal'].forEach(id=>{
      const el=document.getElementById(id);
      if(el) el.style.display='none';
    });
    $('abilityPanel').classList.remove('open');
    tokenAnim=null;
    advance();
  },15000);
  try{
    fn(advance);
  }catch(err){
    console.error('[animQueue] task threw an error, advancing queue anyway:',err);
    ['diceOverlay','battleOverlay','hpEffectOverlay','abilityActivationOverlay','battleChoiceModal','counterChoiceModal','disasterDiceOverlay','mapTransitionBanner','monsterBattleOverlay','monsterChoiceModal'].forEach(id=>{
      const el=document.getElementById(id);
      if(el) el.style.display='none';
    });
    tokenAnim=null;
    advance();
  }
}
let pendingRoomState=null;

/* ---- 戦闘超能力選択（相互選択） ---- */
let currentBattleChoiceDone=null;

socket.on('battleChoicePending',({opponentName})=>{
  console.log('[battleChoicePending] received, opponent:',opponentName);
  // 前のターン/戦闘の演出が全て終わるまで、このモーダルは表示されない
  queueAnim(done=>{
    console.log('[battleChoicePending] showing modal now');
    currentBattleChoiceDone=done;
    showBattleChoiceModal(opponentName);
  });
});

function showBattleChoiceModal(opponentName){
  const me=currentRoom?currentRoom.players.find(p=>p.id===myId):null;
  const body=$('battleChoiceBody');
  body.innerHTML='';
  const title=document.createElement('div');
  title.style.cssText='font-family:var(--fd);color:var(--gold);font-weight:700;margin-bottom:10px;text-align:center;';
  title.textContent=opponentName+' との戦闘 — 超能力を使いますか？';
  body.appendChild(title);
  const usedT=(me&&me.usedTimings)||[];
  const hasCopies=((me&&me.powers)||[]).some(p=>p.isCopy);
  const abilities=((me&&me.powers)||[]).filter(pw=>{
    if(pw.locked||pw.timing!=='battle'||pw.type!=='self') return false;
    if(me.energy<pw.cost) return false;
    if(usedT.includes('battle')) return false;
    if((pw.name==='トラッシュ'||pw.name==='クリアー')&&!hasCopies) return false;
    return true;
  });
  abilities.forEach(pw=>{
    const b=document.createElement('button');
    b.style.textAlign='left';
    b.innerHTML='<b>'+pw.name+'</b> <span style="color:var(--teal);font-size:.8em;">PSY '+pw.cost+'</span><br><span style="font-size:.75em;color:var(--dim);">'+pw.description+'</span>';
    b.onclick=()=>{submitBattleChoice(pw.lineId);};
    body.appendChild(b);
  });
  const skip=document.createElement('button');
  skip.className='dan';
  skip.textContent='使用しない';
  skip.onclick=()=>{submitBattleChoice(null);};
  body.appendChild(skip);
  $('battleChoiceModal').style.display='flex';
}

function submitBattleChoice(powerId){
  console.log('[submitBattleChoice] sending powerId:',powerId);
  socket.emit('submitBattleChoice',{powerId});
  const body=$('battleChoiceBody');
  body.innerHTML='<div style="text-align:center;color:var(--dim);padding:24px 0;">相手の選択を待っています…</div>';
  // 自分の選択が終わった時点でこのタスクは完了扱いにする。
  // 実際の戦闘発動演出（battleAbilityActivated/battleRolled）は
  // 相手の選択後に届く別タスクとして、キューの後続に自然に積まれる。
  if(currentBattleChoiceDone){
    const d=currentBattleChoiceDone;
    currentBattleChoiceDone=null;
    d();
  }
}

/* ---- hpChange ---- */
function refreshPlayerCard(playerId){
  if(!currentRoom) return;
  const p=currentRoom.players.find(pl=>pl.id===playerId);
  if(!p) return;
  const card=$('colLeft').querySelector('.p-card[data-player-id="'+playerId+'"]');
  if(!card) return;
  const hpRow=card.querySelector('.hp-row-val');
  const hpBarInner=card.querySelector('.bar-hp');
  const enRow=card.querySelector('.en-row-val');
  const enBarInner=card.querySelector('.bar-en');
  if(hpRow) hpRow.textContent='HP '+p.hp+'/'+p.maxHp;
  if(hpBarInner) hpBarInner.style.width=Math.max(0,Math.min(100,p.hp/p.maxHp*100))+'%';
  if(enRow) enRow.textContent='PSY '+p.energy+'/'+p.maxEnergy;
  if(enBarInner) enBarInner.style.width=Math.max(0,Math.min(100,p.energy/p.maxEnergy*100))+'%';
}

socket.on('hpChange',({playerId,playerName,amount})=>{
  queueAnim(done=>{
    const isDmg=amount<0;
    const cls=isDmg?'damage':'heal';
    const txt=(isDmg?'':'+')+ amount;
    if(playerId===myId){
      $('hpFlash').className='hp-effect-flash '+cls;
      $('hpFlash').style.animation='none';void $('hpFlash').offsetWidth;$('hpFlash').style.animation='hp-flash .4s ease-out both';
    }
    $('hpEffectNum').className='hp-effect-num '+cls;
    $('hpEffectNum').textContent=playerName+' '+txt;
    $('hpEffectNum').style.animation='none';void $('hpEffectNum').offsetWidth;$('hpEffectNum').style.animation='hp-num-pop .6s ease-out both';
    $('hpEffectOverlay').style.display='flex';
    setTimeout(()=>{
      $('hpEffectOverlay').style.display='none';
      // バーの反映は全アニメーション終了後にまとめて行う（runNextAnimのキュー完了時）
      const cards=$('colLeft').querySelectorAll('.p-card');
      cards.forEach(card=>{
        const nameEl=card.querySelector('.p-name');
        if(nameEl&&nameEl.textContent.includes(playerName)){
          const old=card.querySelector('.hp-change-badge');if(old)old.remove();
          const badge=document.createElement('span');badge.className='hp-change-badge '+cls;badge.textContent=txt;
          nameEl.appendChild(badge);
          setTimeout(()=>{badge.style.opacity='0';setTimeout(()=>badge.remove(),500);},2000);
        }
      });
      setTimeout(done,800);
    },1000);
  });
});

function processDice({playerId,baseRoll,bonus,total,startPos,finalPos:serverFinalPos,reroll,pathBattle,roleName,roleBonus,isGambler,gamblerAdjust,tripleDice,timeEffect},done){
  const pl=currentRoom?currentRoom.players.find(p=>p.id===playerId):null;
  const nm=pl?pl.name:'?';
  // このプレイヤーの表示位置を、サーバーが伝えてきた「移動前の位置」に確定させる。
  // これによりダイス演出中に別の更新が来ても、この値が動くことは絶対にない。
  commitDisplayPosition(playerId,startPos);
  $('diceOverlay').style.display='flex';$('diceInfo').textContent='';$('diceShadow').style.display='block';
  sfxDiceRoll();
  const isTriple=tripleDice&&tripleDice.length===3;
  $('singleDiceArea').style.display=isTriple?'none':'block';
  $('tripleDiceArea').style.display=isTriple?'flex':'none';

  function afterDiceRoll(){
    $('diceShadow').style.display='none';
    let infoHtml='';
    if(isTriple){
      infoHtml=nm+': <span style="color:var(--vio);font-weight:700;">トリプルダイス!</span> ('+tripleDice[0]+'+'+tripleDice[1]+'+'+tripleDice[2]+'='+baseRoll+')';
    } else {
      infoHtml=nm+': 出目 '+baseRoll;
      if(isGambler&&gamblerAdjust) infoHtml+=' <span style="color:#ff6b6b;font-size:.8em;">(ギャンブラー効果 '+(gamblerAdjust>0?'+':'')+gamblerAdjust+')</span>';
    }
    if(roleBonus) infoHtml+=' <span style="color:#22d3ee;font-size:.8em;">'+roleName+'ボーナス +'+roleBonus+'</span>';
    const abilityBonus=bonus-(roleBonus||0)-(gamblerAdjust||0);
    if(abilityBonus) infoHtml+=' <span class="bonus">能力ボーナス +'+abilityBonus+'</span>';
    if(timeEffect) infoHtml+=' <span style="color:var(--gold);font-size:.8em;">('+timeEffect+')</span>';
    infoHtml+=' → <b>'+total+'マス</b>';
    $('diceInfo').innerHTML=infoHtml;
    // reroll check
    const isMyTurn=playerId===myId;
    const me=currentRoom?currentRoom.players.find(p=>p.id===myId):null;
    const canReroll=isMyTurn&&me&&me.canReroll&&!reroll&&!isTriple;
    if(canReroll){
      $('rerollArea').style.display='block';
      $('rerollBtn').onclick=()=>{$('rerollArea').style.display='none';$('diceOverlay').style.display='none';socket.emit('rerollDice');done();};
      $('rerollSkipBtn').onclick=()=>{$('rerollArea').style.display='none';proceedToMove();};
    } else {
      $('rerollArea').style.display='none';
      setTimeout(proceedToMove,1200);
    }
    function proceedToMove(){
      $('diceOverlay').style.display='none';
      const animTarget=(serverFinalPos!=null&&!isMyTurn)?serverFinalPos:Math.min(startPos+total,currentRoom?currentRoom.boardSize:34);
      animateTokenMove(playerId,startPos,animTarget,currentRoom,
        (curPos)=>{
          if(!isMyTurn||curPos<=0||curPos===animTarget) return false;
          const opps=(currentRoom?currentRoom.players:[]).filter(p=>p.id!==playerId&&p.position===curPos&&!p.finished&&p.incapacitatedTurns===0);
          if(opps.length>0){showPathBattleChoice(curPos,opps,done);return true;}
          return false;
        },
        ()=>{
          if(isMyTurn){socket.emit('confirmMove');}
          if(pathBattle){
            setTimeout(()=>{showBattleAnim(pathBattle,()=>{setTimeout(done,500);});},500);
          } else {
            setTimeout(done,500);
          }
        }
      );
    }
  }
  if(isTriple){
    const c1=mkCube($('diceWrap1')),c2=mkCube($('diceWrap2')),c3=mkCube($('diceWrap3'));
    let dc=0;function tDone(){if(++dc<3)return;afterDiceRoll();}
    rollAnim(c1,Math.min(6,Math.max(1,tripleDice[0])),1800+Math.random()*200,null,tDone);
    rollAnim(c2,Math.min(6,Math.max(1,tripleDice[1])),1800+Math.random()*200,null,tDone);
    rollAnim(c3,Math.min(6,Math.max(1,tripleDice[2])),1800+Math.random()*200,null,tDone);
  } else {
    const cube=mkCube($('diceWrap'));
    rollAnim(cube,Math.min(6,Math.max(1,baseRoll)),1800,$('diceShadow'),afterDiceRoll);
  }
}

/* ---- モンスター戦: 超能力選択 ---- */
let currentMonsterChoiceDone=null;

socket.on('monsterBattleChoicePending',({monsterName,monsterImage,monsterAbilityName,monsterAbilityDesc})=>{
  // サーバーはこの選択を待って停止するため、キューを介さず即座に表示する
  (function(){
    const me=currentRoom?currentRoom.players.find(p=>p.id===myId):null;
    const body=$('monsterChoiceBody');
    body.innerHTML='';
    if(monsterImage){
      const img=document.createElement('img');
      img.className='mc-img';
      img.src='/img/monsters/'+monsterImage+'.png';
      body.appendChild(img);
    }
    const title=document.createElement('div');
    title.style.cssText='font-family:var(--fd);color:#ff7ac6;font-weight:700;margin-bottom:6px;text-align:center;';
    title.textContent=monsterName+' が現れた！';
    body.appendChild(title);
    if(monsterAbilityName){
      const ab=document.createElement('div');
      ab.style.cssText='font-size:.78em;color:var(--teal);margin-bottom:10px;text-align:center;';
      ab.textContent='能力: '+monsterAbilityName+' — '+(monsterAbilityDesc||'');
      body.appendChild(ab);
    }
    const usedT=(me&&me.usedTimings)||[];
    const hasCopies=((me&&me.powers)||[]).some(p=>p.isCopy);
    const abilities=((me&&me.powers)||[]).filter(pw=>{
      if(pw.locked||pw.timing!=='battle'||pw.type!=='self') return false;
      if(me.energy<pw.cost) return false;
      if(usedT.includes('battle')) return false;
      if((pw.name==='トラッシュ'||pw.name==='クリアー')&&!hasCopies) return false;
      return true;
    });
    abilities.forEach(pw=>{
      const b=document.createElement('button');
      b.style.textAlign='left';
      b.innerHTML='<b>'+pw.name+'</b> <span style="color:var(--teal);font-size:.8em;">PSY '+pw.cost+'</span><br><span style="font-size:.75em;color:var(--dim);">'+pw.description+'</span>';
      b.onclick=()=>{submitMonsterBattleChoice(pw.lineId);};
      body.appendChild(b);
    });
    const skip=document.createElement('button');
    skip.className='dan';
    skip.textContent='使用しない';
    skip.onclick=()=>{submitMonsterBattleChoice(null);};
    body.appendChild(skip);
    $('monsterChoiceModal').style.display='flex';
  })();
});

function submitMonsterBattleChoice(powerId){
  socket.emit('submitMonsterBattleChoice',{powerId});
  $('monsterChoiceModal').style.display='none';
  if(currentMonsterChoiceDone){
    const d=currentMonsterChoiceDone;
    currentMonsterChoiceDone=null;
    d();
  }
}

socket.on('monsterBattleRolled',(data)=>{
  const{playerId,playerName,playerDie,playerRoll,playerBonus,monsterName,monsterImage,monsterDie,monsterRoll,monsterBonus,monsterAbilityName,monsterAbilityDesc,result,dmg,xp}=data;
  queueAnim(done=>{
    try{
      sfxBattle();
      $('mbTitle').textContent=monsterName+' が現れた！';
      $('mbImg').src=monsterImage?('/img/monsters/'+monsterImage+'.png'):'';
      $('mbImg').style.display=monsterImage?'block':'none';
      $('mbAbility').textContent=monsterAbilityName?('能力: '+monsterAbilityName+' — '+(monsterAbilityDesc||'')):'';
      $('mbPlayerName').textContent=playerName;
      $('mbMonsterName').textContent=monsterName;
      $('mbPlayerRoll').textContent='';$('mbMonsterRoll').textContent='';
      $('mbPlayerBonus').textContent='';$('mbMonsterBonus').textContent='';
      $('mbResult').textContent='';
      $('monsterBattleOverlay').style.display='flex';
      setTimeout(()=>{
        try{
          const cP=mkCube($('mbPlayerDice')),cM=mkCube($('mbMonsterDice'));
          sfxDiceRoll();
          let dc=0;
          function fin(){
            if(++dc<2)return;
            $('mbPlayerRoll').textContent=playerRoll;
            $('mbMonsterRoll').textContent=monsterRoll;
            if(playerBonus) $('mbPlayerBonus').textContent='ボーナス '+(playerBonus>0?'+':'')+playerBonus;
            if(monsterBonus) $('mbMonsterBonus').textContent='ボーナス '+(monsterBonus>0?'+':'')+monsterBonus;
            if(result==='player'){
              $('mbResult').style.color='var(--gold)';
              $('mbResult').textContent=monsterName+'を撃破！ 経験値+'+(xp||0);
            } else if(result==='monster'){
              $('mbResult').style.color='#ef4576';
              $('mbResult').textContent=playerName+'は敗北… 体力'+(dmg||0)+'を失う';
            } else {
              $('mbResult').style.color='#9a8fc4';
              $('mbResult').textContent='引き分け';
            }
            setTimeout(()=>{
              $('monsterBattleOverlay').style.display='none';
              done();
            },2200);
          }
          rollAnim(cP,Math.min(6,Math.max(1,playerDie)),1500+Math.random()*200,null,fin);
          rollAnim(cM,Math.min(6,Math.max(1,monsterDie)),1500+Math.random()*200,null,fin);
        }catch(err){
          console.error('[monsterBattle] error during dice:',err);
          $('monsterBattleOverlay').style.display='none';
          done();
        }
      },1400);
    }catch(err){
      console.error('[monsterBattle] error:',err);
      $('monsterBattleOverlay').style.display='none';
      done();
    }
  });
});

function showBattleAnim(data,onDone){
  const{aId,aName,aDie,aRoll,aRoleName,aRoleId,aBonus,bId,bName,bDie,bRoll,bRoleName,bRoleId,bBonus,dmg,dmgBonus,dmgReduction,result,evaded,evadedByName,knockedName,knockback,aFixed,bFixed,reflected,reflectedToName,aFinalPos,bFinalPos}=data;
  $('battleOverlay').style.display='flex';
  $('btIntro').style.display='flex';$('btDicePhase').style.display='none';$('btResultBanner').style.display='none';
  sfxBattle();
  const imgA=ROLE_BATTLE[aRoleId]?'/img/'+ROLE_BATTLE[aRoleId]+'.png':'/img/'+(ROLE_IMG[aRoleId]||'traveler')+'.png';
  const imgB=ROLE_BATTLE[bRoleId]?'/img/'+ROLE_BATTLE[bRoleId]+'.png':'/img/'+(ROLE_IMG[bRoleId]||'traveler')+'.png';
  $('btImgA').src=imgA;$('btImgB').src=imgB;
  $('btImgA').className='bt-char bt-char-left';$('btImgB').className='bt-char bt-char-right';
  $('btVsText').style.display='';$('btVsText').style.animation='none';void $('btVsText').offsetWidth;$('btVsText').style.animation='bt-vs-pop .4s .5s ease-out both';

  if(evaded){
    // 戦闘回避（サイクロン等）: ダイスロールを行わず、キャラ登場の後すぐに結果を表示
    setTimeout(()=>{
      $('btIntro').style.display='none';
      $('btVsText').style.display='none';$('btResultBanner').style.display='flex';
      $('btResultTitle').textContent='戦闘不成立';
      $('btResultTitle').style.animation='none';void $('btResultTitle').offsetWidth;$('btResultTitle').style.animation='bt-vs-pop .4s ease-out both';
      $('btIntro').style.display='flex';$('btDicePhase').style.display='none';
      $('btResA').textContent='';$('btResB').textContent='';
      $('btResA').className='bt-result-label bt-result-left draw';
      $('btResB').className='bt-result-label bt-result-right draw';
      $('btResultBanner').querySelectorAll('.bt-evade-msg').forEach(e=>e.remove());
      const msg=document.createElement('div');
      msg.className='bt-evade-msg';
      msg.style.cssText='position:absolute;bottom:12%;left:50%;transform:translateX(-50%);font-family:var(--fd);font-size:1.1em;color:var(--teal);text-align:center;text-shadow:0 0 10px rgba(0,0,0,.8);white-space:nowrap;';
      // 後退マス数が0（タイムスライス等）の場合は後退の文言を出さない
      msg.textContent=knockback?(evadedByName+'が戦闘を回避！ '+knockedName+'を'+knockback+'マス後退させた'):(evadedByName+'が戦闘を回避した！');
      $('battleOverlay').appendChild(msg);
      setTimeout(()=>{
        msg.remove();
        $('battleOverlay').style.display='none';
        $('btResultTitle').textContent='RESULT';
        // 後退による位置変化を、サーバーが確定した値でそのまま表示位置として確定させる
        if(aId!=null&&aFinalPos!=null) commitDisplayPosition(aId,aFinalPos);
        if(bId!=null&&bFinalPos!=null) commitDisplayPosition(bId,bFinalPos);
        tokenAnim=null;
        if(currentRoom) drawMap($('mapCanvas'),currentRoom,currentDisplayOverrides());
        if(onDone)onDone();
      },2400);
    },1800);
    return;
  }

  // Phase 2: dice (1.8s later)
  setTimeout(()=>{
    $('btIntro').style.display='none';$('btDicePhase').style.display='flex';
    $('btAN').textContent=aName;$('btBN').textContent=bName;
    $('btRA').textContent='';$('btRB').textContent='';$('btRT').textContent='';$('btDmg').textContent='';
    $('btBonusA').textContent='';$('btBonusB').textContent='';
    sfxBattle();
    const dAF=aFixed?Math.max(1,aRoll):(aDie!=null?aDie:Math.min(6,Math.max(1,aRoll)));
    const dBF=bFixed?Math.max(1,bRoll):(bDie!=null?bDie:Math.min(6,Math.max(1,bRoll)));
    const cA=mkCube($('btSA')),cB=mkCube($('btSB'));
    let dc=0;
    function fin(){
      if(++dc<2)return;
      $('btRA').textContent=aRoll;$('btRB').textContent=bRoll;
      if(aFixed) $('btBonusA').textContent='相手の能力で出目が固定された';
      else if(aBonus) $('btBonusA').textContent=(aRoleName||'')+'ボーナス '+(aBonus>0?'+':'')+aBonus;
      if(bFixed) $('btBonusB').textContent='相手の能力で出目が固定された';
      else if(bBonus) $('btBonusB').textContent=(bRoleName||'')+'ボーナス '+(bBonus>0?'+':'')+bBonus;
      $('btRT').textContent=aRoll>bRoll?aName+' の勝利！':bRoll>aRoll?bName+' の勝利！':'引き分け';
      if(reflected){
        const loserName=result==='a'?bName:aName;
        $('btDmg').textContent=loserName+'はタイムカウンターでダメージを無効化し、'+reflectedToName+'に反射した！';
      } else if(dmg!=null){
        const loserName=result==='a'?bName:aName;
        let dmgText;
        if(dmg===0 && data.blocked){
          dmgText=loserName+'へのダメージはバリアで無効化された！';
        } else {
          dmgText=loserName+'は体力'+dmg+'を失った';
          const extra=[];if(dmgBonus)extra.push('ダメージ+'+dmgBonus);if(dmgReduction)extra.push('軽減-'+dmgReduction);
          if(extra.length)dmgText+=' ('+extra.join('、')+')';
        }
        $('btDmg').textContent=dmgText;
      }
      // Phase 3: result (1.2s later)
      setTimeout(()=>{
        $('btDicePhase').style.display='none';$('btIntro').style.display='flex';
        $('btVsText').style.display='none';$('btResultBanner').style.display='flex';
        $('btResultTitle').style.animation='none';void $('btResultTitle').offsetWidth;$('btResultTitle').style.animation='bt-vs-pop .4s ease-out both';
        let resA='',resB='',clsA='',clsB='';
        const r=result||(aRoll>bRoll?'a':bRoll>aRoll?'b':'draw');
        if(r==='a'){resA='WIN';clsA='win';resB='LOSE';clsB='lose';}
        else if(r==='b'){resA='LOSE';clsA='lose';resB='WIN';clsB='win';}
        else{resA='DRAW';clsA='draw';resB='DRAW';clsB='draw';}
        $('btResA').textContent=resA;$('btResA').className='bt-result-label bt-result-left '+clsA;
        $('btResB').textContent=resB;$('btResB').className='bt-result-label bt-result-right '+clsB;
        $('btResA').style.animation='none';void $('btResA').offsetWidth;$('btResA').style.animation='bt-result-pop .4s ease-out both';
        $('btResB').style.animation='none';void $('btResB').offsetWidth;$('btResB').style.animation='bt-result-pop .4s ease-out both';
        setTimeout(()=>{
          $('battleOverlay').style.display='none';
          tokenAnim=null;
          if(currentRoom) drawMap($('mapCanvas'),currentRoom,currentDisplayOverrides());
          if(onDone)onDone();
        },2000);
      },1200);
    }
    rollAnim(cA,dAF,1600+Math.random()*200,null,fin);
    rollAnim(cB,dBF,1600+Math.random()*200,null,fin);
  },1800);
}

function showEventBanner(text){
  sfxEvent();$('eventBannerText').textContent=text;$('eventBanner').style.display='block';
  setTimeout(()=>{$('eventBanner').style.display='none';},2200);
