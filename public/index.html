<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<title>サイキック・ロード — 超能力すごろく</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#110a22;--panel:#1a1240;--panel-line:#352a62;
  --vio:#9b6bff;--teal:#2dd4bf;--gold:#f2b705;
  --danger:#ef4576;--text:#ece7ff;--dim:#9a8fc4;
  --fd:'Shippori Mincho',serif;--fb:'Zen Kaku Gothic New',sans-serif;
}
/* ===== TITLE / HOME / LOADING / GUIDE ===== */
#titleScreen{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;background:#000;cursor:pointer;overflow:hidden;}
/* ① 暗闇にロゴが浮かび上がり、ゆっくり消える */
#titleScreen .ts-openlogo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);max-width:min(62vw,520px);width:100%;
  opacity:0;filter:drop-shadow(0 0 50px rgba(140,120,255,.85));
  animation:ts-open-logo 5.4s ease-in-out .5s forwards;}
@keyframes ts-open-logo{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.94);}
  22%{opacity:1;transform:translate(-50%,-50%) scale(1);}
  62%{opacity:1;transform:translate(-50%,-50%) scale(1.01);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.03);}
}
/* ② 背景がゆっくりフェードイン（引き気味の画角から始める） */
#titleScreen .ts-bg{position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:0;transform:scale(1.16);animation:ts-bg-in 7s ease-out 5.2s forwards;}
@keyframes ts-bg-in{to{opacity:.9;transform:scale(1.02);}}
#titleScreen .ts-veil{position:absolute;inset:0;opacity:0;animation:ts-veil-in 2.4s ease-out 5.2s forwards;
  background:radial-gradient(circle at 50% 45%,transparent 30%,rgba(5,3,13,.5) 72%,rgba(5,3,13,.92) 100%);}
@keyframes ts-veil-in{to{opacity:1;}}
/* ③ PRESS TO START */
#titleScreen .ts-press{position:absolute;left:50%;bottom:13%;transform:translateX(-50%);
  font-family:var(--fd);font-size:1.08em;letter-spacing:.3em;color:#e6ddff;white-space:nowrap;
  text-shadow:0 0 20px rgba(155,107,255,.9),0 2px 12px rgba(0,0,0,.8);
  opacity:0;animation:ts-press-in 1.2s ease-out 8.2s forwards,ts-blink 2.6s ease-in-out 9.4s infinite;}
@keyframes ts-press-in{to{opacity:1;}}
@keyframes ts-blink{0%,100%{opacity:1;}50%{opacity:.3;}}
/* 演出をスキップした状態 */
#titleScreen.skip .ts-openlogo{animation:none;opacity:0;}
#titleScreen.skip .ts-bg{animation:none;opacity:.9;transform:scale(1.02);}
#titleScreen.skip .ts-veil{animation:none;opacity:1;}
#titleScreen.skip .ts-press{animation:ts-press-in .4s ease-out forwards,ts-blink 2.6s ease-in-out .6s infinite;}

#homeScreen{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;background:#07040f;overflow:hidden;}
#homeScreen .hm-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.22;filter:saturate(.8) blur(2px);animation:hm-drift 40s ease-in-out infinite alternate;}
@keyframes hm-drift{from{transform:scale(1.06) translateX(-1%);}to{transform:scale(1.12) translateX(1%);}}
/* ヴェールは立ち絵より下に敷き、立ち絵が隠れないようにする */
#homeScreen .hm-veil{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(7,4,15,.55),rgba(7,4,15,.8));}
/* 左右のキャラクター立ち絵（背景との境目はマスクでぼかす） */
#homeScreen .hm-char{position:absolute;top:0;bottom:0;width:38%;z-index:2;background-size:cover;background-position:center top;
  opacity:0;transition:opacity 1.4s ease;pointer-events:none;}
#homeScreen .hm-char.on{opacity:.9;}
#homeScreen .hm-char.left{left:0;
  -webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,1) 0%,rgba(0,0,0,.95) 34%,rgba(0,0,0,.4) 72%,rgba(0,0,0,0) 100%);
  mask-image:linear-gradient(90deg,rgba(0,0,0,1) 0%,rgba(0,0,0,.95) 34%,rgba(0,0,0,.4) 72%,rgba(0,0,0,0) 100%);}
#homeScreen .hm-char.right{right:0;
  -webkit-mask-image:linear-gradient(270deg,rgba(0,0,0,1) 0%,rgba(0,0,0,.95) 34%,rgba(0,0,0,.4) 72%,rgba(0,0,0,0) 100%);
  mask-image:linear-gradient(270deg,rgba(0,0,0,1) 0%,rgba(0,0,0,.95) 34%,rgba(0,0,0,.4) 72%,rgba(0,0,0,0) 100%);}
/* メニュー背後だけを暗く落とし、中央の可読性を確保する */
#homeScreen .hm-focus{position:absolute;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(ellipse 46% 78% at 50% 50%,rgba(7,4,15,.92) 30%,rgba(7,4,15,.6) 62%,transparent 100%);}
#homeScreen .hm-inner{position:relative;z-index:4;width:min(92vw,430px);text-align:center;}
#homeScreen .hm-logo{width:min(74vw,360px);margin-bottom:30px;filter:drop-shadow(0 0 30px rgba(140,120,255,.75));}
.hm-btn{display:block;width:100%;margin:0 0 13px;padding:16px 18px;font-family:var(--fd);font-size:1.08em;font-weight:700;letter-spacing:.1em;color:var(--text);
  background:linear-gradient(180deg,rgba(72,52,150,.92),rgba(34,23,80,.94));border:1px solid rgba(140,110,255,.45);border-radius:12px;cursor:pointer;
  position:relative;overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,.55),inset 0 1px 0 rgba(190,170,255,.2);
  transition:transform .16s cubic-bezier(.2,.9,.3,1),box-shadow .16s ease,border-color .16s ease,filter .16s ease;}
.hm-btn::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(120deg,transparent 32%,rgba(200,180,255,.3) 50%,transparent 68%);
  transform:translateX(-120%);transition:transform .6s ease;}
.hm-btn:hover::before{transform:translateX(120%);}
.hm-btn:hover{transform:translateY(-3px);border-color:rgba(180,155,255,.95);filter:brightness(1.12);
  box-shadow:0 10px 34px rgba(130,90,255,.5),inset 0 1px 0 rgba(215,200,255,.32);}
.hm-btn:active{transform:translateY(1px) scale(.98);box-shadow:0 2px 10px rgba(130,90,255,.55),inset 0 3px 10px rgba(0,0,0,.45);}
.hm-btn .hm-sub{display:block;font-family:var(--fb);font-size:.62em;font-weight:400;color:#b9aee0;letter-spacing:.03em;margin-top:4px;}
.hm-btn.primary{background:linear-gradient(180deg,rgba(126,74,224,.95),rgba(66,32,148,.96));border-color:rgba(175,140,255,.7);}
.hm-btn.back{background:linear-gradient(180deg,rgba(48,38,86,.9),rgba(26,20,54,.92));font-size:.94em;}
/* サブメニュー（ゲームを始める→作成/参加）の出入り */
/* サブメニュー: 2枚を常に同じ位置に重ね、切替時にレイアウトが動かないようにする */
.hm-menus{position:relative;}
.hm-menu{transition:opacity .26s ease,transform .26s ease;}
.hm-menu.hide{opacity:0;transform:translateY(-6px);pointer-events:none;
  position:absolute;top:0;left:0;right:0;}
.hm-menu.show{opacity:1;transform:translateY(0);position:relative;}

/* ===== 超能力覚醒前: 暗闇に雫が落ちる演出 ===== */
#awakenScreen{position:fixed;inset:0;z-index:360;display:none;align-items:center;justify-content:center;background:#000;overflow:hidden;}
#awakenScreen .aw-stage{position:relative;width:100%;height:100%;}
/* 落ちてくる雫 */
#awakenScreen .aw-drop{position:absolute;left:50%;top:-14%;width:13px;height:19px;margin-left:-6.5px;
  background:radial-gradient(circle at 38% 32%,#f2f0ff,#b9a6ff 42%,#6c4ad6 78%,#33207a 100%);
  border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;
  transform:rotate(180deg);
  filter:drop-shadow(0 0 12px rgba(160,130,255,.95));
  animation:aw-fall 1.9s cubic-bezier(.6,.02,.9,.42) .5s forwards;}
@keyframes aw-fall{
  0%{top:-14%;opacity:0;transform:rotate(180deg) scaleY(.7);}
  12%{opacity:1;}
  85%{transform:rotate(180deg) scaleY(1.35);}
  100%{top:50%;opacity:1;transform:rotate(180deg) scaleY(1.1);}
}
/* 着水点の閃光 */
#awakenScreen .aw-flash{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;
  background:radial-gradient(circle,#fff,rgba(190,170,255,.9) 40%,transparent 72%);
  opacity:0;animation:aw-flash .5s ease-out 2.35s forwards;}
@keyframes aw-flash{0%{opacity:0;transform:scale(.4);}30%{opacity:1;transform:scale(9);}100%{opacity:0;transform:scale(20);}}
/* 広がる波紋 */
#awakenScreen .aw-ring{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;
  border:2px solid rgba(170,140,255,.85);opacity:0;}
#awakenScreen .aw-ring.r1{animation:aw-ring 2.4s cubic-bezier(.15,.6,.3,1) 2.4s forwards;}
#awakenScreen .aw-ring.r2{animation:aw-ring 2.4s cubic-bezier(.15,.6,.3,1) 2.75s forwards;}
#awakenScreen .aw-ring.r3{animation:aw-ring 2.4s cubic-bezier(.15,.6,.3,1) 3.1s forwards;}
@keyframes aw-ring{0%{opacity:.9;transform:scale(.3);border-width:2.5px;}100%{opacity:0;transform:scale(46);border-width:.4px;}}
/* 中央から満ちていく光 */
#awakenScreen .aw-glow{position:absolute;inset:0;opacity:0;
  background:radial-gradient(circle at 50% 50%,rgba(150,120,255,.55),rgba(90,60,190,.2) 32%,transparent 62%);
  animation:aw-glow 3.4s ease-out 2.45s forwards;}
@keyframes aw-glow{0%{opacity:0;transform:scale(.4);}35%{opacity:1;}100%{opacity:0;transform:scale(2.1);}}
/* 立ち上る粒子 */
#awakenScreen .aw-mote{position:absolute;bottom:38%;width:3px;height:3px;border-radius:50%;background:rgba(200,180,255,.95);
  box-shadow:0 0 8px rgba(160,130,255,.9);opacity:0;}
@keyframes aw-mote{0%{opacity:0;transform:translateY(0) scale(.5);}25%{opacity:1;}100%{opacity:0;transform:translateY(-260px) scale(1.15);}}
/* 覚醒テキスト */
#loadingScreen{position:fixed;inset:0;z-index:350;display:none;align-items:center;justify-content:center;background:#05030d;overflow:hidden;}
/* 背景いっぱいにぼかした同じ画像を敷き、その上に全体が見えるサイズで重ねる */
#loadingScreen .ld-blur{position:absolute;inset:-6%;background-size:cover;background-position:center;
  filter:blur(28px) saturate(.8) brightness(.5);opacity:0;transition:opacity .9s ease;}
#loadingScreen .ld-blur.on{opacity:1;}
#loadingScreen .ld-bg{position:absolute;inset:0;background-size:contain;background-position:center;background-repeat:no-repeat;
  opacity:0;transition:opacity .9s ease;animation:ld-zoom 14s ease-out forwards;
  -webkit-mask-image:radial-gradient(ellipse 72% 72% at 50% 45%,#000 58%,transparent 100%);
  mask-image:radial-gradient(ellipse 72% 72% at 50% 45%,#000 58%,transparent 100%);}
#loadingScreen .ld-bg.on{opacity:.92;}
@keyframes ld-zoom{from{transform:scale(1);}to{transform:scale(1.06);}}
#loadingScreen .ld-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,3,13,.28) 40%,rgba(5,3,13,.86) 78%,rgba(5,3,13,.97) 100%);}
#loadingScreen .ld-inner{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);text-align:center;width:min(88vw,540px);}
#loadingScreen .ld-cap{font-family:var(--fd);font-size:1.05em;color:var(--gold);letter-spacing:.16em;margin-bottom:9px;min-height:1.3em;text-shadow:0 2px 12px rgba(0,0,0,.9);}
#loadingScreen .ld-tip{font-size:.8em;color:#c3b8e6;line-height:1.75;min-height:3.4em;margin-bottom:18px;padding:0 10px;text-shadow:0 2px 10px rgba(0,0,0,.9);}
#loadingScreen .ld-barbg{height:5px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;}
#loadingScreen .ld-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--vio),var(--teal));border-radius:99px;transition:width .35s ease;box-shadow:0 0 14px rgba(155,107,255,.7);}
#loadingScreen .ld-txt{margin-top:10px;font-family:var(--fd);letter-spacing:.24em;color:#d8cfff;font-size:.85em;animation:ts-blink 1.8s ease-in-out infinite;}

#guideScreen{position:fixed;inset:0;z-index:320;display:none;flex-direction:column;background:#0a0618;}
#guideScreen .gd-head{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--panel-line);background:rgba(16,10,36,.96);}
#guideScreen .gd-head h2{margin:0;font-size:1.1em;color:var(--gold);}
#guideScreen .gd-body{flex:1;display:flex;min-height:0;}
#guideScreen .gd-nav{width:186px;flex-shrink:0;border-right:1px solid var(--panel-line);overflow-y:auto;padding:10px 8px;background:rgba(14,9,30,.7);}
#guideScreen .gd-nav button{position:relative;display:block;width:100%;height:62px;text-align:left;margin:0 0 8px;padding:0 12px;
  font-family:var(--fd);font-size:.92em;color:var(--dim);background:rgba(20,14,44,.6);
  border:1px solid var(--panel-line);border-radius:10px;cursor:pointer;overflow:hidden;transition:all .18s ease;}
/* 右側にその項目を象徴する画像を、顔が見える位置で配置 */
#guideScreen .gd-nav button .gdn-img{position:absolute;top:0;right:0;bottom:0;width:64%;
  background-size:cover;background-position:center 18%;opacity:.55;transition:opacity .18s ease;
  -webkit-mask-image:linear-gradient(270deg,rgba(0,0,0,1) 0%,rgba(0,0,0,.85) 42%,rgba(0,0,0,0) 100%);
  mask-image:linear-gradient(270deg,rgba(0,0,0,1) 0%,rgba(0,0,0,.85) 42%,rgba(0,0,0,0) 100%);}
#guideScreen .gd-nav button .gdn-label{position:relative;z-index:2;text-shadow:0 2px 8px rgba(0,0,0,.95);}
#guideScreen .gd-nav button:hover{color:var(--text);border-color:rgba(155,107,255,.6);}
#guideScreen .gd-nav button:hover .gdn-img{opacity:.75;}
#guideScreen .gd-nav button.active{color:var(--text);border-color:var(--vio);box-shadow:0 0 18px rgba(155,107,255,.28);}
#guideScreen .gd-nav button.active .gdn-img{opacity:.85;}
#guideScreen .gd-content{flex:1;overflow-y:auto;padding:18px 22px;min-width:0;}
.gd-sec-title{font-family:var(--fd);font-size:1.3em;color:var(--gold);margin:0 0 4px;}
.gd-sec-lead{font-size:.84em;color:var(--dim);line-height:1.8;margin-bottom:16px;}
.gd-card{display:flex;gap:14px;background:rgba(26,18,64,.55);border:1px solid var(--panel-line);border-radius:12px;padding:12px;margin-bottom:12px;cursor:pointer;
  transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;}
.gd-card:hover{transform:translateY(-2px);border-color:rgba(155,107,255,.75);box-shadow:0 6px 22px rgba(120,80,255,.28);}
.gd-card .gd-thumb{width:118px;height:132px;flex-shrink:0;border-radius:9px;overflow:hidden;position:relative;background:#0d0920;}
.gd-card.wide .gd-thumb{width:180px;height:150px;}
/* 背後に同じ画像をぼかして敷き、手前は全体が入るサイズで表示。境目はマスクで溶かす */
.gd-card .gd-thumb .gd-thumb-blur{position:absolute;inset:-16%;background-size:cover;background-position:center;filter:blur(16px) brightness(.5) saturate(.85);}
.gd-card .gd-thumb .gd-thumb-img{position:absolute;inset:0;background-size:contain;background-position:center;background-repeat:no-repeat;
  -webkit-mask-image:radial-gradient(ellipse 84% 84% at 50% 50%,#000 66%,transparent 100%);
  mask-image:radial-gradient(ellipse 84% 84% at 50% 50%,#000 66%,transparent 100%);}
/* 詳細モーダル */
#gdModal{position:fixed;inset:0;z-index:340;display:none;align-items:center;justify-content:center;background:rgba(4,2,10,.88);padding:20px;}
#gdModal .gdm-card{position:relative;width:min(96vw,940px);height:min(88vh,620px);border-radius:16px;overflow:hidden;
  display:flex;align-items:stretch;
  background:linear-gradient(180deg,rgba(34,24,78,.98),rgba(18,12,44,.99));border:1px solid rgba(140,110,255,.45);
  box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 50px rgba(120,80,255,.2);animation:gdm-in .28s cubic-bezier(.2,.9,.3,1) both;}
@keyframes gdm-in{from{opacity:0;transform:translateY(18px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
/* 左: 画像（余白を作らず枠いっぱいに広げる） */
#gdModal .gdm-hero{position:relative;width:46%;flex-shrink:0;overflow:hidden;background:#0d0920;}
#gdModal .gdm-hero .gdm-hero-blur{display:none;}
#gdModal .gdm-hero .gdm-hero-img{position:absolute;inset:0;background-size:cover;background-position:center 15%;background-repeat:no-repeat;}
#gdModal .gdm-hero::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,transparent 68%,rgba(24,16,58,.9) 100%);}
/* 右: 説明 */
#gdModal .gdm-body{flex:1;min-width:0;padding:24px 26px;overflow-y:auto;}
#gdModal .gdm-name{font-family:var(--fd);font-size:1.5em;color:var(--gold);margin-bottom:14px;text-shadow:0 2px 14px rgba(0,0,0,.7);}
#gdModal .gdm-desc{font-size:.86em;color:#cfc4ee;line-height:1.9;}
#gdModal .gdm-close{position:absolute;top:12px;right:12px;z-index:3;padding:7px 13px;font-size:.8em;margin:0;}
@media(max-width:720px){
  #gdModal .gdm-card{flex-direction:column;height:auto;max-height:90vh;overflow-y:auto;}
  #gdModal .gdm-hero{width:100%;height:min(40vh,280px);}
  #gdModal .gdm-hero::after{background:linear-gradient(180deg,transparent 65%,rgba(24,16,58,.92) 100%);}
  #gdModal .gdm-body{overflow:visible;}
}
.gd-card-body{flex:1;min-width:0;}
.gd-card-name{font-family:var(--fd);font-size:1.02em;color:var(--text);margin-bottom:4px;}
.gd-card-desc{font-size:.79em;color:var(--dim);line-height:1.75;}
.gd-tags{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px;}
.gd-tag{font-size:.68em;padding:2px 8px;border-radius:99px;background:rgba(45,212,191,.13);color:var(--teal);border:1px solid rgba(45,212,191,.3);}
.gd-tag.dmg{background:rgba(239,69,118,.13);color:#ff8aa8;border-color:rgba(239,69,118,.3);}
.gd-tag.gold{background:rgba(242,183,5,.13);color:var(--gold);border-color:rgba(242,183,5,.3);}
.gd-stage{border-left:2px solid var(--panel-line);padding:6px 0 6px 11px;margin-top:8px;}
.gd-stage-name{font-family:var(--fd);font-size:.9em;color:var(--vio);}
.gd-stage-meta{font-size:.68em;color:var(--dim);margin:2px 0 3px;}
.gd-stage-desc{font-size:.76em;color:var(--dim);line-height:1.7;}
/* 超能力: 系統ごとに枠で囲い、表形式で見せる */
.pw-line{border:1px solid rgba(140,110,255,.4);border-radius:11px;overflow:hidden;margin-bottom:12px;background:rgba(14,9,32,.5);}
.pw-line-head{padding:8px 12px;font-family:var(--fd);font-size:.92em;color:var(--gold);
  background:linear-gradient(180deg,rgba(60,42,128,.75),rgba(38,26,88,.65));border-bottom:1px solid rgba(140,110,255,.3);}
.pw-table{width:100%;border-collapse:collapse;font-size:.75em;}
.pw-table th{background:rgba(28,20,64,.75);color:#b6a9e2;font-weight:600;text-align:left;padding:6px 9px;
  border-bottom:1px solid rgba(140,110,255,.25);white-space:nowrap;font-size:.94em;}
.pw-table td{padding:7px 9px;border-bottom:1px solid rgba(140,110,255,.14);color:#cfc4ee;line-height:1.65;vertical-align:top;}
.pw-table tr:last-child td{border-bottom:none;}
.pw-table .pw-nm{font-family:var(--fd);color:var(--vio);white-space:nowrap;font-size:1.04em;}
.pw-table .pw-lv{white-space:nowrap;color:var(--teal);}
.pw-table .pw-cost{white-space:nowrap;color:var(--gold);text-align:center;}
.pw-table .pw-tm{white-space:nowrap;color:#b6a9e2;font-size:.94em;}
.pw-table .pw-ef{min-width:150px;}
/* 役職: ステータス表示 */
.rl-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:7px;margin-top:9px;}
/* 別窓（モーダル）では1列に縦並びし、横幅いっぱいに伸ばす */
#gdModal .rl-stats{display:flex;flex-direction:column;gap:8px;}
#gdModal .rl-stat{width:100%;padding:11px 16px;}
#gdModal .rl-stat .rl-k{font-size:.82em;}
#gdModal .rl-stat .rl-v{font-size:1.05em;}
.rl-stat{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px;border-radius:8px;
  background:rgba(14,9,32,.6);border:1px solid rgba(140,110,255,.25);}
.rl-stat .rl-k{font-size:.7em;color:var(--dim);white-space:nowrap;}
.rl-stat .rl-v{font-family:var(--fd);font-size:.92em;font-weight:700;white-space:nowrap;}
.rl-v.up{color:var(--teal);}
.rl-v.down{color:#ff8aa8;}
.rl-v.norm{color:#cfc4ee;}
.rl-special{margin-top:9px;font-size:.78em;color:#cfc4ee;line-height:1.8;

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow-y:auto;}
body{font-family:var(--fb);background:radial-gradient(circle at 20% 0%,#241a4d,var(--bg) 55%);color:var(--text);}
.wrap{max-width:1100px;margin:0 auto;padding:8px 12px;min-height:100vh;display:flex;flex-direction:column;}
.wrap.in-game{height:100vh;overflow:hidden;max-width:none;}
body:has(.wrap.in-game){background:transparent;}
.top-bar{text-align:center;flex-shrink:0;padding-bottom:4px;}
.top-bar.hidden{display:none;}
.top-bar h1{font-family:var(--fd);font-weight:700;letter-spacing:.08em;font-size:1.2rem;background:linear-gradient(90deg,var(--teal),var(--vio));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline;}
.top-bar .sub{color:var(--dim);font-size:.72em;margin-left:8px;}
#error{position:fixed;top:4px;left:50%;transform:translateX(-50%);color:var(--danger);font-size:.82em;text-align:center;min-height:1em;z-index:200;pointer-events:none;background:rgba(6,3,16,.85);padding:2px 12px;border-radius:6px;}
#error:empty{background:transparent;}
/* --- panels --- */
.panel{border:1px solid rgba(140,110,255,.3);border-radius:12px;padding:14px;
  background:linear-gradient(180deg,rgba(38,26,88,.82),rgba(20,13,50,.88));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 10px 34px rgba(0,0,0,.5);}
input{padding:6px 10px;background:#13102a;border:1px solid var(--panel-line);border-radius:6px;color:var(--text);font-family:var(--fb);font-size:.85em;}
input:focus{outline:none;border-color:var(--vio);}
button{position:relative;overflow:hidden;padding:9px 16px;cursor:pointer;margin:2px 4px 2px 0;
  background:linear-gradient(180deg,rgba(72,52,150,.95),rgba(38,26,88,.95));
  border:1px solid rgba(140,110,255,.45);color:var(--text);border-radius:8px;
  font-family:var(--fd);font-size:.84em;font-weight:600;letter-spacing:.04em;
  box-shadow:0 2px 10px rgba(0,0,0,.45),inset 0 1px 0 rgba(190,170,255,.18);
  transition:transform .14s cubic-bezier(.2,.9,.3,1),box-shadow .14s ease,border-color .14s ease,filter .14s ease;}
button::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(120deg,transparent 30%,rgba(190,170,255,.28) 50%,transparent 70%);
  transform:translateX(-120%);transition:transform .55s ease;}
button:hover:not(:disabled)::before{transform:translateX(120%);}
button:hover:not(:disabled){transform:translateY(-2px);border-color:rgba(175,150,255,.9);
  box-shadow:0 6px 20px rgba(120,80,255,.45),inset 0 1px 0 rgba(210,195,255,.3);filter:brightness(1.1);}
button:active:not(:disabled){transform:translateY(1px) scale(.97);
  box-shadow:0 1px 6px rgba(120,80,255,.5),inset 0 2px 8px rgba(0,0,0,.45);filter:brightness(1.25);}
button:disabled{opacity:.3;cursor:not-allowed;}
button.pri{background:linear-gradient(180deg,rgba(45,212,191,.95),rgba(20,140,128,.95));color:#04211d;
  border-color:rgba(120,255,235,.6);box-shadow:0 2px 12px rgba(45,212,191,.35),inset 0 1px 0 rgba(220,255,250,.4);font-weight:700;}
button.pri:hover:not(:disabled){box-shadow:0 6px 24px rgba(45,212,191,.55),inset 0 1px 0 rgba(220,255,250,.5);}
button.dan{background:linear-gradient(180deg,rgba(239,69,118,.95),rgba(150,32,66,.95));border-color:rgba(255,140,175,.5);
  box-shadow:0 2px 12px rgba(239,69,118,.3),inset 0 1px 0 rgba(255,200,215,.28);}
/* クリック時の波紋エフェクト */
.btn-ripple{position:absolute;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%) scale(0);
  background:radial-gradient(circle,rgba(210,195,255,.55),rgba(155,107,255,0) 70%);animation:btn-ripple .55s ease-out forwards;}
@keyframes btn-ripple{to{transform:translate(-50%,-50%) scale(1);opacity:0;}}
ul{list-style:none;padding:0;}
h2{font-family:var(--fd);font-size:.95rem;color:var(--teal);margin-bottom:6px;}
h3{font-family:var(--fd);font-size:.82rem;color:var(--dim);margin:8px 0 4px;}
.me{font-weight:700;color:var(--teal);}
.rdy{color:#6ee7a0;font-size:.78em;} .nrdy{color:var(--dim);font-size:.78em;}
.tb{background:var(--gold);color:#3a2900;padding:1px 6px;border-radius:99px;font-size:.68em;font-weight:700;margin-left:4px;}
.db{background:var(--danger);color:#fff;padding:1px 6px;border-radius:99px;font-size:.68em;font-weight:700;margin-left:4px;}
.bar-bg{background:rgba(8,5,20,.75);border-radius:99px;height:8px;width:100%;display:block;overflow:hidden;border:1px solid rgba(140,110,255,.25);}
.bar-hp{background:linear-gradient(90deg,#ef4576,#ff8a9c);height:100%;transition:width .4s;box-shadow:0 0 10px rgba(239,69,118,.55);}
.bar-en{background:linear-gradient(90deg,#2dd4bf,#7ee8f5);height:100%;transition:width .4s;box-shadow:0 0 10px rgba(45,212,191,.55);}
.bar-xp{background:linear-gradient(90deg,#f2b705,#ffd54f);height:100%;transition:width .4s;box-shadow:0 0 8px rgba(242,183,5,.6);}
.bar-bg-xp{background:rgba(8,5,20,.75);border-radius:99px;height:3px;width:100%;display:block;overflow:hidden;border:1px solid rgba(140,110,255,.2);}
.lv{font-size:.7em;font-weight:700;color:var(--gold);margin-left:4px;}
.sr{font-size:.72em;color:var(--dim);margin-top:2px;}
/* pre-game centered */
/* ロビー/エントリー画面の背景（ホーム画面と同じ演出） */
#screenBg{position:fixed;inset:0;z-index:-1;display:none;overflow:hidden;background:#07040f;}
#screenBg.on{display:block;}
/* ゲーム中は盤面の視認性を優先し、背景を控えめにする */
#screenBg.dim .sb-char{opacity:.28;}
#screenBg.dim .sb-focus{background:radial-gradient(ellipse 62% 92% at 50% 50%,rgba(7,4,15,.96) 44%,rgba(7,4,15,.82) 76%,rgba(7,4,15,.7) 100%);}
#screenBg .sb-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.22;filter:saturate(.8) blur(2px);animation:hm-drift 40s ease-in-out infinite alternate;}
#screenBg .sb-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,4,15,.55),rgba(7,4,15,.8));}
#screenBg .sb-char{position:absolute;top:0;bottom:0;width:38%;background-size:cover;background-position:center top;
  opacity:0;transition:opacity 1.4s ease;}
#screenBg .sb-char.on{opacity:.9;}
#screenBg .sb-char.left{left:0;
  -webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,1) 0%,rgba(0,0,0,.95) 34%,rgba(0,0,0,.4) 72%,rgba(0,0,0,0) 100%);
  mask-image:linear-gradient(90deg,rgba(0,0,0,1) 0%,rgba(0,0,0,.95) 34%,rgba(0,0,0,.4) 72%,rgba(0,0,0,0) 100%);}
#screenBg .sb-char.right{right:0;
  -webkit-mask-image:linear-gradient(270deg,rgba(0,0,0,1) 0%,rgba(0,0,0,.95) 34%,rgba(0,0,0,.4) 72%,rgba(0,0,0,0) 100%);
  mask-image:linear-gradient(270deg,rgba(0,0,0,1) 0%,rgba(0,0,0,.95) 34%,rgba(0,0,0,.4) 72%,rgba(0,0,0,0) 100%);}
#screenBg .sb-focus{position:absolute;inset:0;
  background:radial-gradient(ellipse 48% 80% at 50% 50%,rgba(7,4,15,.93) 32%,rgba(7,4,15,.62) 64%,transparent 100%);}
/* 超能力覚醒画面（説明画面のモーダルと同じ構成） */
#powerReveal{width:min(96vw,940px);margin:12px auto;}
#powerReveal .pr-card{position:relative;height:min(88vh,620px);border-radius:16px;overflow:hidden;display:flex;align-items:stretch;
  background:linear-gradient(180deg,rgba(34,24,78,.96),rgba(18,12,44,.98));border:1px solid rgba(140,110,255,.45);
  box-shadow:0 20px 60px rgba(0,0,0,.65),0 0 50px rgba(120,80,255,.18);}
#powerReveal .pr-hero{position:relative;width:46%;flex-shrink:0;overflow:hidden;background:#0d0920;}
#powerReveal .pr-hero .pr-hero-img{position:absolute;inset:0;background-size:cover;background-position:center 15%;animation:gdm-in .5s ease-out both;}
#powerReveal .pr-hero::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,transparent 68%,rgba(24,16,58,.9) 100%);}
#powerReveal .pr-body{flex:1;min-width:0;padding:24px 26px;overflow-y:auto;display:flex;flex-direction:column;
  scrollbar-width:none;-ms-overflow-style:none;}
#powerReveal .pr-body::-webkit-scrollbar{display:none;width:0;height:0;}
#powerReveal #powerRevealList{flex-shrink:0;}
#powerReveal .pr-name{font-family:var(--fd);font-size:1.6em;color:var(--gold);margin-bottom:8px;text-shadow:0 2px 14px rgba(0,0,0,.75);}
#powerReveal .pr-lead{font-size:.78em;color:var(--dim);line-height:1.8;margin-bottom:14px;}
@media(max-width:720px){
  #powerReveal .pr-card{flex-direction:column;height:auto;max-height:90vh;overflow-y:auto;}
  #powerReveal .pr-hero{width:100%;height:min(34vh,240px);}
  #powerReveal .pr-hero::after{background:linear-gradient(180deg,transparent 62%,rgba(24,16,58,.92) 100%);}
  #powerReveal .pr-body{overflow:visible;}
  #powerReveal #confirmPowersBtn{margin-top:16px !important;}
}
#entry,#lobby,#roleSelect{max-width:440px;margin:20px auto;}
/* エントリー/ロビー画面の共通ヘッダー（ロゴ） */
.scr-logo{display:block;width:min(60vw,260px);margin:0 auto 16px;filter:drop-shadow(0 0 22px rgba(140,120,255,.65));}
.scr-sub{text-align:center;font-family:var(--fd);font-size:.92em;color:var(--gold);letter-spacing:.12em;margin-bottom:14px;}
/* ロビー画面の刷新 */
#lobby .lb-code{display:flex;align-items:center;gap:10px;justify-content:center;background:rgba(13,9,32,.75);border:1px solid rgba(140,110,255,.35);border-radius:10px;padding:11px 14px;margin-bottom:14px;}
#lobby .lb-code-label{font-size:.72em;color:var(--dim);letter-spacing:.1em;}
#lobby .lb-code-val{font-family:var(--fd);font-size:1.5em;font-weight:700;color:var(--gold);letter-spacing:.24em;text-shadow:0 0 16px rgba(242,183,5,.45);}
#lobby .lb-copy{font-size:.68em;padding:5px 11px;margin:0;}
#lobby .lb-slots{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.lb-slot{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;background:linear-gradient(180deg,rgba(46,32,102,.6),rgba(26,18,64,.6));border:1px solid rgba(140,110,255,.28);}
.lb-slot.me-slot{border-color:rgba(45,212,191,.55);box-shadow:0 0 16px rgba(45,212,191,.18);}
.lb-slot.empty{background:rgba(20,14,44,.3);border-style:dashed;border-color:var(--panel-line);color:var(--dim);justify-content:center;font-size:.78em;letter-spacing:.08em;}
.lb-slot .lb-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;box-shadow:0 0 10px currentColor;}
.lb-slot .lb-name{flex:1;font-family:var(--fd);font-size:.95em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lb-slot .lb-badge{font-size:.66em;padding:3px 9px;border-radius:99px;flex-shrink:0;}
.lb-badge.ready{background:rgba(45,212,191,.18);color:var(--teal);border:1px solid rgba(45,212,191,.4);}
.lb-badge.wait{background:rgba(255,255,255,.05);color:var(--dim);border:1px solid var(--panel-line);}
.lb-badge.host{background:rgba(242,183,5,.16);color:var(--gold);border:1px solid rgba(242,183,5,.35);}
.lb-badge.bot{background:rgba(155,107,255,.16);color:var(--vio);border:1px solid rgba(155,107,255,.35);}
#lobby .lb-actions{display:flex;gap:8px;flex-wrap:wrap;}
#lobby .lb-actions button{flex:1;min-width:110px;margin:0;padding:12px 10px;}
#finished{display:none;position:fixed;inset:0;z-index:60;align-items:center;justify-content:center;background:rgba(6,3,16,.9);}
#finished .panel{max-width:420px;width:90%;}
.role-card{border:1px solid var(--panel-line);border-radius:8px;padding:10px;margin-bottom:8px;background:rgba(255,255,255,.02);display:flex;justify-content:space-between;align-items:center;gap:10px;}
/* role carousel */
#roleSelect{max-width:620px;margin:12px auto;}
.carousel-wrap{position:relative;overflow:hidden;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.6);}
.carousel-track{display:flex;transition:transform .4s ease;}
.carousel-slide{min-width:100%;box-sizing:border-box;}
/* 画像を枠いっぱいに広げ、その上に説明を重ねる */
.carousel-slide .rc-card{position:relative;border:1px solid rgba(140,110,255,.35);border-radius:16px;overflow:hidden;
  height:min(86vh,760px);display:flex;flex-direction:column;justify-content:flex-end;}
.carousel-slide .rc-bgblur{position:absolute;inset:-10%;background-size:cover;background-position:center;filter:blur(24px) brightness(.45) saturate(.85);}
.carousel-slide .rc-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 14%;}
.carousel-slide .rc-shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(10,6,26,.5) 80%,rgba(10,6,26,.9) 100%);}
/* 役職名・説明・ボタンは画像より少し遅れてフェードインさせる */
.carousel-slide .rc-overlay{position:relative;z-index:2;padding:18px 18px 16px;}
.carousel-slide.reveal .rc-overlay{animation:rc-fade .55s ease-out .35s both;}
@keyframes rc-fade{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.carousel-slide .rc-name{font-family:var(--fd);font-size:1.6em;font-weight:700;color:var(--gold);margin:0 0 10px 64px;
  text-shadow:0 2px 18px rgba(0,0,0,.98),0 0 26px rgba(242,183,5,.4);}
/* テキストボックス: 枠線なし・透明度高め・境目をぼかす */
.carousel-slide .rc-desc{font-size:.85em;color:#e6dffb;line-height:1.9;margin-bottom:14px;text-align:left;
  background:rgba(10,6,26,.32);border:none;border-radius:12px;padding:13px 15px;
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  text-shadow:0 1px 10px rgba(0,0,0,.95);
  -webkit-mask-image:radial-gradient(ellipse 118% 130% at 50% 50%,#000 60%,transparent 100%);
  mask-image:radial-gradient(ellipse 118% 130% at 50% 50%,#000 60%,transparent 100%);}
.carousel-slide .rc-card button{width:100%;padding:14px;font-size:1em;margin:0;}
/* 左右端のクリック領域 */
.car-edge{position:absolute;top:0;bottom:0;width:16%;min-width:56px;z-index:6;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:2.4em;color:rgba(255,255,255,.35);text-shadow:0 2px 14px rgba(0,0,0,.9);
  transition:background .2s ease,color .2s ease;user-select:none;}
.car-edge.prev{left:0;background:linear-gradient(90deg,rgba(10,6,26,.45),transparent);}
.car-edge.next{right:0;background:linear-gradient(270deg,rgba(10,6,26,.45),transparent);}
.car-edge:hover{color:rgba(255,255,255,.95);}
.car-edge.prev:hover{background:linear-gradient(90deg,rgba(120,80,220,.5),transparent);}
.car-edge.next:hover{background:linear-gradient(270deg,rgba(120,80,220,.5),transparent);}
.car-edge:active{transform:scale(.97);}
.carousel-dots{display:flex;justify-content:center;gap:7px;margin-top:10px;}
.carousel-dots .dot{width:9px;height:9px;border-radius:50%;background:var(--panel-line);cursor:pointer;transition:all .2s ease;}
.carousel-dots .dot.active{background:var(--gold);box-shadow:0 0 10px rgba(242,183,5,.7);transform:scale(1.2);}
/* player card role image */
.p-card-img{width:32px;height:32px;border-radius:6px;object-fit:cover;flex-shrink:0;border:1px solid var(--panel-line);}
/* ===== GAME LAYOUT (3-column) ===== */
#game{display:none;flex:1;min-height:0;}
.game-grid{position:relative;display:grid;grid-template-columns:220px 1fr 220px;grid-template-rows:auto 1fr;gap:8px;height:100%;min-height:0;}
.game-header{grid-column:1/4;display:flex;justify-content:center;align-items:center;gap:14px;flex-shrink:0;
  padding:8px 14px;border-radius:0 0 14px 14px;
  background:linear-gradient(180deg,rgba(38,26,88,.72),rgba(20,13,50,.5));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(140,110,255,.28);border-top:none;}
.game-header h2{margin:0;font-family:var(--fd);font-size:1.02em;font-weight:700;letter-spacing:.06em;color:var(--text);}
.game-header h2 #mapLabel{text-shadow:0 0 14px rgba(242,183,5,.4);}
/* 次のプレイヤー予告 */
.next-turn{display:flex;align-items:center;gap:7px;padding:4px 11px;border-radius:99px;
  background:rgba(14,9,34,.6);border:1px solid rgba(140,110,255,.3);}
.next-turn .nt-label{font-size:.6em;letter-spacing:.14em;color:var(--dim);}
.next-turn .nt-name{font-family:var(--fd);font-size:.82em;color:var(--teal);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* 順位表示（右カラム内・ログの上） */
.rank-board{display:flex;flex-direction:column;gap:4px;flex-shrink:0;
  padding:8px 10px;border-radius:11px;
  background:linear-gradient(180deg,rgba(38,26,88,.72),rgba(20,13,50,.62));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(140,110,255,.28);box-shadow:0 4px 18px rgba(0,0,0,.45);}
.rank-board .rk-title{font-size:.58em;letter-spacing:.18em;color:var(--dim);text-align:center;margin-bottom:2px;}
.rank-row{display:flex;align-items:center;gap:6px;font-size:.72em;transition:all .3s ease;}
.rank-row .rk-no{font-family:var(--fd);font-weight:700;width:15px;text-align:center;}
.rank-row.r1 .rk-no{color:#ffd54f;text-shadow:0 0 8px rgba(242,183,5,.8);}
.rank-row.r2 .rk-no{color:#d8d8e8;}
.rank-row.r3 .rk-no{color:#d8a06a;}
.rank-row.r4 .rk-no{color:var(--dim);}
.rank-row .rk-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;box-shadow:0 0 6px currentColor;}
.rank-row .rk-name{max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
.rank-row .rk-pos{color:var(--dim);font-size:.88em;margin-left:auto;padding-left:6px;}
.rank-row.me-row .rk-name{color:var(--teal);font-weight:700;}
.rank-row.goal .rk-pos{color:var(--gold);}
.col-left{grid-column:1;grid-row:2;overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:0;}
.col-center{grid-column:2;grid-row:2;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;}
.col-center canvas{border-radius:10px;border:1px solid var(--panel-line);box-shadow:0 4px 20px rgba(0,0,0,.5);max-width:100%;max-height:100%;object-fit:contain;}
.col-right{grid-column:3;grid-row:2;overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:0;}
/* ゲーム画面のカード類も、他画面と同じすりガラス調に統一する */
.p-card{border:1px solid rgba(140,110,255,.3);border-radius:11px;padding:10px;
  background:linear-gradient(180deg,rgba(46,32,102,.55),rgba(24,16,58,.6));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 3px 14px rgba(0,0,0,.35);transition:border-color .2s ease,box-shadow .2s ease;}
.p-card.turn-now{border-color:rgba(242,183,5,.65);box-shadow:0 0 20px rgba(242,183,5,.22);}
.p-name{font-size:.82em;display:flex;align-items:center;gap:4px;}
.p-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
#log{max-height:100px;overflow-y:auto;padding:8px 10px;border-radius:11px;font-size:.72em;
  background:linear-gradient(180deg,rgba(24,16,58,.6),rgba(14,9,34,.7));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(140,110,255,.28);color:var(--dim);line-height:1.7;}
/* カスタムスクロールバー（テーマカラーに合わせる） */
/* 左カラムはスクロール可能だがバーは表示しない */
.col-left{scrollbar-width:none;-ms-overflow-style:none;}
.col-left::-webkit-scrollbar{display:none;width:0;height:0;}
.col-right,#log{scrollbar-width:thin;scrollbar-color:var(--vio) transparent;}
.col-right::-webkit-scrollbar,#log::-webkit-scrollbar{width:4px;}
.col-right::-webkit-scrollbar-track,#log::-webkit-scrollbar-track{background:rgba(13,9,32,.4);border-radius:99px;}
.col-right::-webkit-scrollbar-thumb,#log::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--vio),#5a3fb8);border-radius:99px;border:1px solid var(--panel-line);}
.col-right::-webkit-scrollbar-thumb:hover,#log::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#ad84ff,var(--vio));}
#log div{margin-bottom:2px;line-height:1.3;}
#log div:last-child{color:var(--text);}
/* action buttons full width in right column */
.col-right button{width:100%;text-align:center;margin:3px 0;padding:11px 12px;}
#myTurnControls{border:1px solid rgba(140,110,255,.32);border-radius:11px;padding:10px;
  background:linear-gradient(180deg,rgba(46,32,102,.5),rgba(24,16,58,.58));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 3px 14px rgba(0,0,0,.35);}
/* ability panel */
/* 超能力パネル: マップを覆う中央モーダルとして最前面に表示する */
#abilityPanel{position:fixed;inset:0;z-index:210;display:none;align-items:center;justify-content:center;
  background:rgba(4,2,10,.72);padding:20px;}
#abilityPanel.open{display:flex;}
#abilityPanel .ap-inner{width:min(94vw,400px);max-height:78vh;overflow-y:auto;padding:14px;border-radius:16px;
  background:linear-gradient(180deg,rgba(52,36,116,.98),rgba(24,16,58,.99));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(170,140,255,.55);
  box-shadow:0 18px 55px rgba(0,0,0,.8),0 0 46px rgba(130,90,255,.3);
  animation:ap-in .22s cubic-bezier(.2,.9,.3,1) both;}
@keyframes ap-in{from{opacity:0;transform:translateY(-12px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
#abilityPanel .ap-inner::-webkit-scrollbar{width:5px;}
#abilityPanel .ap-inner::-webkit-scrollbar-track{background:rgba(13,9,32,.5);border-radius:99px;}
#abilityPanel .ap-inner::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--vio),#5a3fb8);border-radius:99px;}
#abilityPanel .ap-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:2px 4px 11px;margin-bottom:10px;border-bottom:1px solid rgba(170,140,255,.28);}
#abilityPanel .ap-title{font-family:var(--fd);font-size:1em;font-weight:700;color:var(--gold);letter-spacing:.08em;}
#abilityPanel .ap-psy{font-size:.74em;color:var(--teal);margin-left:auto;margin-right:6px;}
#abilityPanel .ap-close{padding:4px 11px;font-size:.74em;margin:0;}
#abilityPanel .ap-empty{padding:20px 8px;text-align:center;color:var(--dim);font-size:.82em;}
/* 超能力カードのデザイン刷新 */
.ab-card{position:relative;border-radius:11px;padding:11px 12px;margin-bottom:8px;cursor:pointer;overflow:hidden;
  background:linear-gradient(135deg,rgba(72,50,150,.55),rgba(34,22,84,.6));
  border:1px solid rgba(150,120,255,.35);
  transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;}
.ab-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--vio),var(--teal));}
.ab-card:hover{transform:translateX(3px);border-color:rgba(190,160,255,.85);
  box-shadow:0 6px 22px rgba(130,90,255,.4);}
.ab-card:active{transform:translateX(1px) scale(.985);}
.ab-card .ab-top{display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-wrap:wrap;}
.ab-card .ab-name{font-family:var(--fd);font-size:.95em;font-weight:700;color:#f0e9ff;}
.ab-card .ab-cost{font-size:.7em;padding:2px 8px;border-radius:99px;background:rgba(45,212,191,.16);
  color:var(--teal);border:1px solid rgba(45,212,191,.4);white-space:nowrap;}
.ab-card .ab-timing{font-size:.66em;padding:2px 7px;border-radius:99px;background:rgba(155,107,255,.14);
  color:#c4b3ff;border:1px solid rgba(155,107,255,.3);white-space:nowrap;}
.ab-card .ab-tag{font-size:.64em;padding:2px 7px;border-radius:99px;white-space:nowrap;}
.ab-card .ab-tag.evo{background:rgba(242,183,5,.15);color:var(--gold);border:1px solid rgba(242,183,5,.35);}
.ab-card .ab-tag.copy{background:rgba(255,122,198,.14);color:#ff9ed4;border:1px solid rgba(255,122,198,.32);}
.ab-card .ab-desc{font-size:.74em;color:#bfb3e0;line-height:1.65;}
#myTurnControls{position:relative;}
/* ability glow */
button.ability-glow{animation:abglow 1.2s ease-in-out infinite alternate;border-color:var(--vio);}
@keyframes abglow{from{box-shadow:0 0 4px rgba(155,107,255,.3);}to{box-shadow:0 0 14px rgba(155,107,255,.7),0 0 24px rgba(155,107,255,.3);}}
/* power reveal cards */
.pw-card{border:1px solid var(--panel-line);border-radius:8px;padding:10px;margin-bottom:8px;background:rgba(155,107,255,.05);}
.pw-card .pw-name{font-weight:700;font-size:.95em;} .pw-card .pw-desc{font-size:.82em;color:var(--dim);margin-top:3px;}
/* tooltip (global fixed element, JS-driven) */
.role-tip{cursor:help;border-bottom:1px dotted var(--dim);}
#tooltip{display:none;position:fixed;background:#1a1240;border:1px solid var(--panel-line);border-radius:6px;padding:8px 10px;font-size:.78em;color:var(--text);min-width:180px;max-width:280px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.7);pointer-events:none;line-height:1.5;}
/* ===== 3D DICE ===== */
/* モンスター戦闘オーバーレイ */
#monsterBattleOverlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:124;background:radial-gradient(circle,rgba(80,10,60,.5),rgba(6,3,16,.93));}
#monsterBattleOverlay .mb-inner{text-align:center;max-width:90vw;}
#monsterBattleOverlay .mb-title{font-family:var(--fd);font-size:1.5em;font-weight:900;color:#ff7ac6;letter-spacing:.1em;text-shadow:0 0 24px rgba(255,80,180,.6);margin-bottom:10px;animation:db-pop .4s ease-out both;}
#monsterBattleOverlay .mb-img{display:block;max-width:min(80vw,480px);max-height:46vh;object-fit:contain;border-radius:10px;margin:0 auto 10px;box-shadow:0 0 40px rgba(0,0,0,.7);animation:db-img-in .5s ease-out both;}
#monsterBattleOverlay .mb-ability{font-size:.85em;color:var(--teal);margin-bottom:12px;min-height:1.2em;}
#monsterBattleOverlay .mb-row{display:flex;align-items:center;justify-content:center;gap:36px;}
#monsterBattleOverlay .mb-side{display:flex;flex-direction:column;align-items:center;gap:6px;}
#monsterBattleOverlay .mb-name{font-family:var(--fd);font-size:.95em;color:var(--text);}
#monsterBattleOverlay .mb-roll{font-family:var(--fd);font-size:1.4em;color:var(--gold);min-height:1.4em;}
#monsterBattleOverlay .mb-bonus{font-size:.72em;color:#22d3ee;min-height:1.1em;}
#monsterBattleOverlay .mb-vs{font-family:var(--fd);font-size:2em;font-weight:900;color:var(--gold);text-shadow:0 0 20px rgba(242,183,5,.5);}
#monsterBattleOverlay .mb-result{font-family:var(--fd);font-size:1.25em;margin-top:14px;min-height:1.4em;}
#diceOverlay,#battleOverlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:100;background:rgba(6,3,16,.55);}
/* 災害のサイコロ演出 */
#disasterDiceOverlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:122;background:radial-gradient(circle,rgba(120,10,10,.4),rgba(6,3,16,.88));}
#disasterDiceOverlay .ddo-inner{text-align:center;display:flex;flex-direction:column;align-items:center;}
#disasterDiceOverlay .d3-wrap{margin:0 auto;}
#disasterDiceOverlay .ddo-intro{font-family:var(--fd);font-size:1.2em;font-weight:700;color:#ff8a8a;text-shadow:0 0 16px rgba(255,60,60,.5);margin-bottom:18px;min-height:1.4em;}
#disasterDiceOverlay .ddo-result{font-family:var(--fd);font-size:1.15em;color:var(--text);text-shadow:0 0 10px rgba(0,0,0,.8);margin-top:18px;min-height:1.4em;}
.dice-stage{display:flex;flex-direction:column;align-items:center;gap:6px;}
.d3-wrap{width:120px;height:120px;perspective:400px;}
.d3-wrap.sm{width:80px;height:80px;perspective:300px;}
.d3-cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;}
.d3-face{position:absolute;width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:12px;background:linear-gradient(145deg,#f7f2e8,#e6ddd0);border:1.5px solid #c0b8a0;box-shadow:inset 2px 2px 6px rgba(255,255,255,.4),inset -2px -2px 6px rgba(0,0,0,.1);}
.d3-wrap.sm .d3-face{border-radius:8px;border-width:1px;}
.d3-face .pg{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:66%;height:66%;}
.d3-face .pp{border-radius:50%;margin:auto;visibility:hidden;}
.d3-wrap:not(.sm) .d3-face .pp{width:15px;height:15px;}
.d3-wrap.sm .d3-face .pp{width:10px;height:10px;}
.d3-face .pp.on{visibility:visible;background:radial-gradient(circle at 38% 32%,#666,#111);box-shadow:inset 0 1px 3px rgba(0,0,0,.7),0 0.5px 0 rgba(255,255,255,.15);}
/* face positions — half of side = 60px for 120, 40px for 80 */
.d3-wrap .fc1{transform:rotateY(0deg) translateZ(60px);}
.d3-wrap .fc6{transform:rotateY(180deg) translateZ(60px);}
.d3-wrap .fc3{transform:rotateY(90deg) translateZ(60px);}
.d3-wrap .fc4{transform:rotateY(-90deg) translateZ(60px);}
.d3-wrap .fc5{transform:rotateX(90deg) translateZ(60px);}
.d3-wrap .fc2{transform:rotateX(-90deg) translateZ(60px);}
.d3-wrap.sm .fc1{transform:rotateY(0deg) translateZ(40px);}
.d3-wrap.sm .fc6{transform:rotateY(180deg) translateZ(40px);}
.d3-wrap.sm .fc3{transform:rotateY(90deg) translateZ(40px);}
.d3-wrap.sm .fc4{transform:rotateY(-90deg) translateZ(40px);}
.d3-wrap.sm .fc5{transform:rotateX(90deg) translateZ(40px);}
.d3-wrap.sm .fc2{transform:rotateX(-90deg) translateZ(40px);}
.dice-shadow{width:80px;height:14px;background:radial-gradient(ellipse,rgba(0,0,0,.5),transparent 70%);border-radius:50%;margin:0 auto;}
#tripleDiceArea{display:flex;justify-content:center;align-items:center;gap:16px;}
.dice-info{font-family:var(--fd);font-size:1.3em;color:var(--text);text-align:center;min-height:1.4em;margin-top:6px;}
.dice-info .bonus{color:var(--teal);font-size:.85em;display:block;margin-top:3px;}
.battle-stage{display:flex;flex-direction:column;align-items:center;gap:8px;}
.battle-row{display:flex;align-items:center;gap:20px;}
.battle-side{display:flex;flex-direction:column;align-items:center;gap:4px;}
.battle-nm{font-size:.85em;color:var(--text);font-weight:500;}
.battle-rn{font-family:var(--fd);font-size:1.4em;color:var(--gold);min-height:1.4em;}
.battle-bonus{font-size:.75em;color:#22d3ee;min-height:1.1em;}
.battle-dmg{font-size:.85em;color:var(--dim);margin-top:4px;min-height:1.1em;}
/* battle intro animation */
#btIntro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.bt-char{position:absolute;height:80vh;max-height:600px;object-fit:contain;filter:drop-shadow(0 0 20px rgba(0,0,0,.8));}
.bt-char-left{left:-40%;animation:bt-slide-left .6s ease-out forwards;}
.bt-char-right{right:-40%;animation:bt-slide-right .6s ease-out forwards;transform:scaleX(-1);}
@keyframes bt-slide-left{to{left:10%;}}
@keyframes bt-slide-right{to{right:10%;}}
.bt-vs-text{position:relative;z-index:10;font-family:var(--fd);font-size:5em;font-weight:900;color:var(--gold);text-shadow:0 0 40px rgba(242,183,5,.6),0 0 80px rgba(242,183,5,.3),4px 4px 0 #3a2900;letter-spacing:.1em;animation:bt-vs-pop .4s .5s ease-out both;}
@keyframes bt-vs-pop{from{opacity:0;transform:scale(3);}to{opacity:1;transform:scale(1);}}
/* battle result labels */
#btResultBanner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
.bt-result-title{font-family:var(--fd);font-size:2.5em;font-weight:900;color:var(--gold);text-shadow:0 0 30px rgba(242,183,5,.5),3px 3px 0 #3a2900;margin-bottom:20px;animation:bt-vs-pop .4s ease-out both;}
.bt-result-row{display:flex;align-items:center;justify-content:center;gap:60px;width:100%;}
.bt-result-label{font-family:var(--fd);font-size:3.5em;font-weight:900;letter-spacing:.08em;text-shadow:0 0 30px rgba(0,0,0,.8),3px 3px 0 rgba(0,0,0,.5);animation:bt-result-pop .4s ease-out both;}
@keyframes bt-result-pop{from{opacity:0;transform:scale(2);}to{opacity:1;transform:scale(1);}}
.bt-result-label.win{color:#f2b705;}
.bt-result-label.lose{color:#ef4576;}
.bt-result-label.draw{color:#9a8fc4;}
.battle-vs{font-family:var(--fd);font-size:1.4em;color:var(--gold);text-shadow:0 0 10px rgba(242,183,5,.5);}
.battle-rt{font-family:var(--fd);font-size:1em;color:var(--gold);min-height:1.2em;}
/* ターン開始バナー */
/* 自分のターン開始時の中央メッセージ */
#myTurnBanner{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:95;pointer-events:none;}
#myTurnBanner .mtb-glow{position:absolute;inset:0;background:radial-gradient(ellipse 60% 34% at 50% 50%,rgba(242,183,5,.22),transparent 70%);animation:mtb-glow 2.2s ease-out both;}
@keyframes mtb-glow{0%{opacity:0;}22%{opacity:1;}70%{opacity:1;}100%{opacity:0;}}
#myTurnBanner .mtb-line{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(242,183,5,.9),transparent);}
#myTurnBanner .mtb-line.t{top:calc(50% - 46px);animation:mtb-line 2.2s ease-out both;}
#myTurnBanner .mtb-line.b{top:calc(50% + 46px);animation:mtb-line 2.2s ease-out both;}
@keyframes mtb-line{0%{opacity:0;transform:scaleX(0);}25%{opacity:1;transform:scaleX(1);}72%{opacity:1;transform:scaleX(1);}100%{opacity:0;transform:scaleX(1);}}
#myTurnBanner .mtb-text{position:relative;font-family:var(--fd);font-size:2.3em;font-weight:900;color:var(--gold);
  letter-spacing:.16em;white-space:nowrap;text-shadow:0 0 30px rgba(242,183,5,.85),0 3px 0 #4a3200,0 4px 18px rgba(0,0,0,.9);
  animation:mtb-text 2.2s cubic-bezier(.2,.9,.3,1) both;}
@keyframes mtb-text{0%{opacity:0;transform:scale(1.5);letter-spacing:.5em;}
  22%{opacity:1;transform:scale(1);letter-spacing:.16em;}
  72%{opacity:1;transform:scale(1);}
  100%{opacity:0;transform:scale(1.06);}}
#turnBanner{position:fixed;top:0;left:0;right:0;display:none;align-items:center;justify-content:center;z-index:90;pointer-events:none;}
#turnBanner .tb-inner{font-family:var(--fd);font-size:1.3em;font-weight:700;color:var(--gold);background:linear-gradient(180deg,rgba(18,10,34,.92),rgba(18,10,34,.85));border-bottom:2px solid rgba(242,183,5,.4);padding:18px 40px;text-align:center;letter-spacing:.06em;text-shadow:0 0 16px rgba(242,183,5,.4);animation:tb-slide .5s ease-out;width:100%;}
@keyframes tb-slide{from{opacity:0;transform:translateY(-20px);}to{opacity:1;transform:translateY(0);}}
/* マスイベントバナー */
#eventBanner{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);display:none;z-index:90;pointer-events:none;}
#eventBanner .ev-inner{font-family:var(--fd);font-size:1.15em;font-weight:500;color:var(--text);background:linear-gradient(180deg,rgba(18,10,34,.94),rgba(18,10,34,.88));border:1px solid var(--panel-line);border-radius:10px;padding:14px 28px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.6);animation:ev-pop .4s ease-out;}
/* 災害バナー（ゲーム中1度だけの大きな演出） */
#disasterBanner{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:120;background:radial-gradient(circle,rgba(120,10,10,.55),rgba(6,3,16,.92));}
#disasterBanner .db-inner{text-align:center;animation:db-pop .5s ease-out both;}
#disasterBanner .db-title{font-family:var(--fd);font-size:2.4em;font-weight:900;color:#ff5252;letter-spacing:.15em;text-shadow:0 0 30px rgba(255,60,60,.7),3px 3px 0 #3a0000;margin-bottom:14px;}
#disasterBanner .db-img{display:block;max-width:min(80vw,560px);max-height:48vh;object-fit:contain;border-radius:10px;margin:0 auto 16px;box-shadow:0 0 40px rgba(0,0,0,.7);animation:db-img-in .6s ease-out both;}
#disasterBanner .db-text{font-family:var(--fd);font-size:1.15em;color:var(--text);text-shadow:0 0 10px rgba(0,0,0,.8);max-width:80vw;}
@keyframes db-img-in{from{opacity:0;transform:scale(1.15);}to{opacity:1;transform:scale(1);}}
@keyframes db-pop{from{opacity:0;transform:scale(1.4);}to{opacity:1;transform:scale(1);}}
/* マップ移行バナー */
#mapTransitionBanner{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:123;background:radial-gradient(circle,rgba(45,212,191,.25),rgba(6,3,16,.94));}
#mapTransitionBanner .mt-inner{text-align:center;animation:db-pop .5s ease-out both;}
#mapTransitionBanner .mt-title{font-family:var(--fd);font-size:1.3em;color:var(--teal);letter-spacing:.1em;margin-bottom:10px;}
#mapTransitionBanner .mt-map{font-family:var(--fd);font-size:2.6em;font-weight:900;color:var(--gold);text-shadow:0 0 30px rgba(242,183,5,.6),3px 3px 0 #3a2900;margin-bottom:14px;}
#mapTransitionBanner .mt-text{font-family:var(--fd);font-size:1.1em;color:var(--text);text-shadow:0 0 10px rgba(0,0,0,.8);}
/* 予知の祈祷 結果表示（画面中央・大きめ） */
#foresightBanner{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:121;background:rgba(6,3,16,.85);}
#foresightBanner .fs-inner{text-align:center;max-width:80vw;animation:db-pop .45s ease-out both;padding:28px 36px;border-radius:16px;background:linear-gradient(180deg,rgba(36,26,77,.7),rgba(21,15,48,.85));box-shadow:0 0 50px rgba(0,0,0,.6);}
#foresightBanner .fs-title{font-family:var(--fd);font-size:1.3em;font-weight:700;letter-spacing:.1em;margin-bottom:14px;}
#foresightBanner .fs-title.positive{color:#ff5252;text-shadow:0 0 24px rgba(255,60,60,.6);}
#foresightBanner .fs-title.negative{color:var(--teal);text-shadow:0 0 24px rgba(45,212,191,.5);}
#foresightBanner .fs-text{font-family:var(--fd);font-size:1.5em;color:var(--text);line-height:1.6;text-shadow:0 0 10px rgba(0,0,0,.8);}
@keyframes ev-pop{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
/* レベルアップバナー */
#lvUpBanner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);display:none;z-index:95;pointer-events:none;}
#lvUpBanner .lvu-inner{font-family:var(--fd);font-size:1.5em;font-weight:700;color:var(--vio);background:linear-gradient(180deg,rgba(18,10,34,.95),rgba(18,10,34,.9));border:2px solid var(--vio);border-radius:14px;padding:20px 40px;text-align:center;box-shadow:0 0 30px rgba(155,107,255,.5);animation:lvu-pop .6s ease-out;}
@keyframes lvu-pop{from{opacity:0;transform:scale(.7);}to{opacity:1;transform:scale(1);}}
/* HP変動エフェクト */
#hpEffectOverlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:92;pointer-events:none;}
.hp-effect-num{font-family:var(--fd);font-size:4em;font-weight:900;text-shadow:0 0 30px rgba(0,0,0,.8),3px 3px 0 rgba(0,0,0,.5);animation:hp-num-pop .6s ease-out both;}
.hp-effect-num.damage{color:#ef4576;}
.hp-effect-num.heal{color:#2dd4bf;}
@keyframes hp-num-pop{0%{opacity:0;transform:scale(2) translateY(20px);}50%{opacity:1;transform:scale(1) translateY(0);}100%{opacity:1;transform:scale(1) translateY(0);}}
.hp-effect-flash{position:fixed;inset:0;pointer-events:none;animation:hp-flash .4s ease-out both;}

<script src="/socket.io/socket.io.js"></script>
<script>
const $=id=>document.getElementById(id);
const socket=io();
let myId=null,currentRoom=null;
socket.on('connect',()=>{myId=socket.id;});

const ROLE_IMG={traveler:'traveler',professor:'professor',veteran:'veteran',farmer:'farmer',sheriff:'sheriff',assassin:'assassin',illusionist:'illusionist',gambler:'gambler'};
const ROLE_ICON={traveler:'icon_traveler',professor:'icon_professor',veteran:'icon_veteran',farmer:'icon_farmer',sheriff:'icon_sheriff',assassin:'icon_assassin',illusionist:'icon_illusionist',gambler:'icon_gambler'};
const ROLE_BATTLE={traveler:'battle_traveler',professor:'battle_professor',veteran:'battle_veteran',farmer:'battle_farmer',sheriff:'battle_sheriff',assassin:'battle_assassin',illusionist:'battle_illusionist',gambler:'battle_gambler'};

/* ========== SOUND ENGINE ========== */
let audioCtx=null;
function getAudio(){if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
const SFX_VOL=0.25;
function playFile(src,vol){
  const a=new Audio(src);a.volume=vol||SFX_VOL;a.play().catch(()=>{});
}
function sfxDiceRoll(){playFile('/sfx/dice_single.mp3',SFX_VOL);}
function sfxBattle(){playFile('/sfx/dice_double.mp3',SFX_VOL);}
function sfxMagic(){playFile(Math.random()<0.5?'/sfx/magic1.mp3':'/sfx/magic2.mp3',SFX_VOL);}
function sfxAbilityOpen(){playFile('/sfx/select_open.mp3',SFX_VOL);}
function sfxAbilityPick(){playFile('/sfx/select_pick.mp3',SFX_VOL);}
function sfxStep(){
  try{const ctx=getAudio();const o=ctx.createOscillator();const g=ctx.createGain();
  o.type='sine';o.frequency.value=600;g.gain.setValueAtTime(0.12,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.08);
  o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+0.08);}catch(e){}
}
function sfxEvent(){
  try{const ctx=getAudio();[523,659,784].forEach((f,i)=>{const o=ctx.createOscillator();const g=ctx.createGain();
  o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.1,ctx.currentTime+i*0.1);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.1+0.2);
  o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+i*0.1);o.stop(ctx.currentTime+i*0.1+0.2);});}catch(e){}
}
function sfxTurn(){
  try{const ctx=getAudio();const o=ctx.createOscillator();const g=ctx.createGain();
  o.type='sine';o.frequency.setValueAtTime(440,ctx.currentTime);o.frequency.setValueAtTime(550,ctx.currentTime+0.1);
  g.gain.setValueAtTime(0.1,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.25);
  o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+0.25);}catch(e){}
}
function sfxVictory(){
  try{const ctx=getAudio();[523,659,784,1047].forEach((f,i)=>{const o=ctx.createOscillator();const g=ctx.createGain();
  o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0.15,ctx.currentTime+i*0.15);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.15+0.4);
  o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+i*0.15);o.stop(ctx.currentTime+i*0.15+0.4);});}catch(e){}
}

/* ========== 3D DICE ========== */
const PIPS={1:[5],2:[3,7],3:[3,5,7],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
const FROT={1:{x:0,y:0},2:{x:90,y:0},3:{x:0,y:-90},4:{x:0,y:90},5:{x:-90,y:0},6:{x:0,y:180}};

function mkCube(wrap){
  wrap.innerHTML='';
  const cube=document.createElement('div');
  cube.className='d3-cube';
  for(let n=1;n<=6;n++){
    const f=document.createElement('div');
    f.className='d3-face fc'+n;
    const g=document.createElement('div');g.className='pg';
    const on=new Set(PIPS[n]);
    for(let i=1;i<=9;i++){const p=document.createElement('div');p.className='pp'+(on.has(i)?' on':'');g.appendChild(p);}
    f.appendChild(g);cube.appendChild(f);
  }
  wrap.appendChild(cube);
  return cube;
}

function rollAnim(cube,val,dur,shEl,cb){
  const tgt=FROT[val];
  const sx=Math.random()*360,sy=Math.random()*360,sz=Math.random()*180;
  const ex=(3+Math.floor(Math.random()*2))*360+tgt.x;
  const ey=(3+Math.floor(Math.random()*2))*360+tgt.y;
  const ez=(1+Math.floor(Math.random()*2))*360;
  const t0=performance.now();
  cube.style.transition='none';
  (function frame(now){
    const p=Math.min((now-t0)/dur,1);
    let e=p<.6?1-Math.pow(1-p/.6,3.5):1+Math.sin((p-.6)/.4*Math.PI*3)*.02*(1-p);
    const rx=sx+(ex-sx)*e,ry=sy+(ey-sy)*e,rz=sz+(ez-sz)*e;
    let bh=0;
    if(p<.4) bh=Math.sin(p/.4*Math.PI)*60;
    else if(p<.6) bh=Math.sin((p-.4)/.2*Math.PI)*20;
    else if(p<.75) bh=Math.sin((p-.6)/.15*Math.PI)*7;
    else if(p<.85) bh=Math.sin((p-.75)/.1*Math.PI)*2;
    cube.style.transform='translateY('+ -bh +'px) rotateX('+rx+'deg) rotateY('+ry+'deg) rotateZ('+rz+'deg)';
    if(shEl){const s=1-bh/80;shEl.style.transform='scaleX('+(0.4+s*.6)+')';shEl.style.opacity=(0.2+s*.5).toFixed(2);}
    if(p<1) requestAnimationFrame(frame);
    else{cube.style.transform='rotateX('+tgt.x+'deg) rotateY('+tgt.y+'deg)';if(cb)cb();}
  })(t0);
}

/* ========== CANVAS MAP ========== */
const COLS=7,CW=88,CH=80,PX=30,PY=26;
const TERR=[
  {bg:'#2e5a2a',glyph:'grass'},{bg:'#1e4828',glyph:'tree'},{bg:'#5a5468',glyph:'mtn'},
  {bg:'#204870',glyph:'water'},{bg:'#4a3e58',glyph:'ruin'},{bg:'#2e2838',glyph:'cave'}
];
let cells=[];

// マップの形状に応じたマス座標（行・列）を返す。
// serpentine: 蛇行 / spiral: 外周から内へ渦を巻く / zigzag: 大きく上下に振れる稲妻
function buildCellGrid(total, layout, cols){
  const C=cols||7;
  const out=[];
  if(layout==='spiral'){
    const rows=Math.ceil(total/C);
    // 外周から内側へ時計回りに埋める
    const grid=[];for(let r=0;r<rows;r++){grid.push(new Array(C).fill(-1));}
    let top=0,bottom=rows-1,left=0,right=C-1,idx=0;
    while(top<=bottom&&left<=right&&idx<total){
      for(let c=left;c<=right&&idx<total;c++){grid[top][c]=idx++;}
      top++;
      for(let r=top;r<=bottom&&idx<total;r++){grid[r][right]=idx++;}
      right--;
      if(top<=bottom){for(let c=right;c>=left&&idx<total;c--){grid[bottom][c]=idx++;}bottom--;}
      if(left<=right){for(let r=bottom;r>=top&&idx<total;r--){grid[r][left]=idx++;}left++;}
    }
    for(let i=0;i<total;i++) out.push({r:0,c:0});
    for(let r=0;r<rows;r++){for(let c=0;c<C;c++){const v=grid[r][c];if(v>=0&&v<total) out[v]={r,c};}}
    return out;
  }
  if(layout==='zigzag'){
    // 稲妻状: 2列ずつ進みながら上下に大きく振れる
    const rowSpan=4; // 上下の振れ幅
    for(let i=0;i<total;i++){
      const c=Math.floor(i/rowSpan);
      const within=i%rowSpan;
      const r=(c%2===0)?within:(rowSpan-1-within);
      out.push({r,c});
    }
    return out;
  }
  // serpentine（既定）
  for(let i=0;i<total;i++){
    const r=Math.floor(i/C);let c=i%C;if(r%2===1)c=C-1-c;
    out.push({r,c});
  }
  return out;
}
function hex(ctx,cx,cy,rad){ctx.beginPath();for(let i=0;i<6;i++){const a=Math.PI/3*i-Math.PI/6;if(i===0)ctx.moveTo(cx+rad*Math.cos(a),cy+rad*Math.sin(a));else ctx.lineTo(cx+rad*Math.cos(a),cy+rad*Math.sin(a));}ctx.closePath();}
function rng32(s){return()=>{s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function drawMap(cv,rm,tokenPosOverride){
  const tot=rm.boardSize+1;
  const layout=rm.mapLayout||'serpentine';
  const cols=rm.mapCols||COLS;
  const grid=buildCellGrid(tot,layout,cols);
  // 実際に使われた行数・列数からキャンバスサイズを決める
  let maxR=0,maxC=0;
  grid.forEach(g=>{if(g.r>maxR)maxR=g.r;if(g.c>maxC)maxC=g.c;});
  const rows=maxR+1,useCols=maxC+1;
  const W=useCols*CW+PX*2,H=rows*CH+PY*2;
  cv.width=W*2;cv.height=H*2;cv.style.width=W+'px';cv.style.height=H+'px';
  const c=cv.getContext('2d');c.scale(2,2);
  // bg
  const bg=c.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#150e2a');bg.addColorStop(1,'#0e0818');
  c.fillStyle=bg;c.fillRect(0,0,W,H);
  // stars
  const rn=rng32(77);for(let i=0;i<60;i++){c.fillStyle='rgba(200,190,255,'+(rn()*.25+.08)+')';c.beginPath();c.arc(rn()*W,rn()*H,rn()*.7+.2,0,Math.PI*2);c.fill();}

  cells=[];
  for(let i=0;i<tot;i++){const g=grid[i];cells.push({x:PX+g.c*CW+CW/2,y:PY+g.r*CH+CH/2});}
  // path
  c.strokeStyle='rgba(155,107,255,.18)';c.lineWidth=2.5;c.setLineDash([5,4]);
  for(let i=1;i<tot;i++){c.beginPath();c.moveTo(cells[i-1].x,cells[i-1].y);c.lineTo(cells[i].x,cells[i].y);c.stroke();}
  c.setLineDash([]);
  // ショートカット（近道/落とし穴）の線を描く
  const scs=rm.mapShortcuts||[];
  scs.forEach(s=>{
    if(s.from>=tot||s.to>=tot) return;
    const a=cells[s.from],b=cells[s.to];
    c.save();
    c.strokeStyle=s.backward?'rgba(239,69,118,.55)':'rgba(45,212,191,.55)';
    c.lineWidth=3;c.setLineDash([8,5]);
    c.beginPath();
    // 少し弧を描いて目立たせる
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const dx=b.x-a.x,dy=b.y-a.y;
    const nx=-dy,ny=dx;const len=Math.hypot(nx,ny)||1;
    const off=Math.min(60,Math.hypot(dx,dy)*0.25);
    c.moveTo(a.x,a.y);
    c.quadraticCurveTo(mx+nx/len*off,my+ny/len*off,b.x,b.y);
    c.stroke();
    // 終点に矢印マーカー
    c.setLineDash([]);
    c.fillStyle=s.backward?'rgba(239,69,118,.85)':'rgba(45,212,191,.85)';
    c.beginPath();c.arc(b.x,b.y,5,0,Math.PI*2);c.fill();
    c.restore();
  });
  // cells
  const R=30;
  const terr=(rm.mapTerrain&&rm.mapTerrain.length)?rm.mapTerrain:null;
  // 現在の手番プレイヤーが立っているマス（脈動で強調する）
  const curP=rm.players.find(p=>p.id===rm.currentTurnId);
  const curPos=curP?((tokenPosOverride&&tokenPosOverride[curP.id]!=null)?tokenPosOverride[curP.id]:curP.position):-1;
  const puls=(Math.sin(boardT/380)+1)/2; // 0〜1 の脈動
  for(let i=0;i<tot;i++){
    const{x:cx,y:cy}=cells[i];const isS=i===0,isG=i===rm.boardSize;
    // マップ固有の地形セットがあればそれを使う
    let t;
    if(terr){
      const glyph=terr[i%terr.length];
      t=TERR.find(x=>x.glyph===glyph)||TERR[i%TERR.length];
    } else {
      t=TERR[i%TERR.length];
    }
    const scFrom=scs.find(s=>s.from===i);
    // ゴールマスは常時、金色の光を放つ
    if(isG){
      const gg=(Math.sin(boardT/500)+1)/2;
      const gr=c.createRadialGradient(cx,cy,R*0.3,cx,cy,R*(1.5+gg*0.35));
      gr.addColorStop(0,'rgba(242,183,5,'+(0.32+gg*0.2)+')');
      gr.addColorStop(0.55,'rgba(242,183,5,'+(0.12+gg*0.08)+')');
      gr.addColorStop(1,'transparent');
      c.fillStyle=gr;c.beginPath();c.arc(cx,cy,R*(1.5+gg*0.35),0,Math.PI*2);c.fill();
    }
    // 手番プレイヤーのいるマスを脈動させる
    if(i===curPos){
      const pr=c.createRadialGradient(cx,cy,R*0.2,cx,cy,R*(1.25+puls*0.28));
      pr.addColorStop(0,'rgba(155,107,255,'+(0.30+puls*0.22)+')');
      pr.addColorStop(1,'transparent');
      c.fillStyle=pr;c.beginPath();c.arc(cx,cy,R*(1.25+puls*0.28),0,Math.PI*2);c.fill();
    }
    c.fillStyle='rgba(0,0,0,.25)';hex(c,cx+1.5,cy+1.5,R);c.fill();
    c.fillStyle=isS?'#186058':isG?'#5a4800':t.bg;hex(c,cx,cy,R);c.fill();
    const ig=c.createRadialGradient(cx-3,cy-3,1,cx,cy,R);
    ig.addColorStop(0,isS?'rgba(45,212,191,.25)':isG?'rgba(242,183,5,.35)':'rgba(255,255,255,.08)');ig.addColorStop(1,'transparent');
    c.fillStyle=ig;hex(c,cx,cy,R);c.fill();
    // ショートカット起点は枠を強調
    if(i===curPos){
      c.strokeStyle='rgba(200,170,255,'+(0.65+puls*0.35)+')';c.lineWidth=2+puls*1.4;
    } else {
      c.strokeStyle=isS?'#2dd4bf':isG?('rgba(242,183,5,'+(0.7+((Math.sin(boardT/500)+1)/2)*0.3)+')'):(scFrom?(scFrom.backward?'#ef4576':'#2dd4bf'):'rgba(155,107,255,.3)');
      c.lineWidth=scFrom||isG?2.4:1.2;
    }
    hex(c,cx,cy,R);c.stroke();
    c.save();c.translate(cx,cy);
    if(isS) drawStart(c); else if(isG) drawGoal(c); else drawTer(c,t.glyph);
    c.restore();
    c.fillStyle=isG?'#f2b705':isS?'#2dd4bf':'rgba(255,255,255,.35)';c.font='bold 7px sans-serif';c.textAlign='center';c.textBaseline='bottom';
    c.fillText(isG?'GOAL':isS?'START':i,cx,cy+R-1);
    // 罠マス: 揺らめく炎
    const trapsHere=(rm.traps||[]).filter(t=>t.position===i);
    if(trapsHere.length>0){
      const n=Math.min(trapsHere.length,3);
      c.save();c.translate(cx,cy-R+9);
      for(let k=0;k<n;k++){
        const ph=boardT/150+k*2.1+i*0.7;      // 個別に揺れる位相
        const sway=Math.sin(ph)*1.6;
        const grow=1+Math.sin(ph*1.7)*0.22;
        c.save();
        c.translate((k-n/2+0.5)*10+sway,0);
        c.scale(1,grow);
        // 外炎
        const fg=c.createLinearGradient(0,-7,0,5);
        fg.addColorStop(0,'rgba(255,232,120,.95)');
        fg.addColorStop(.45,'rgba(255,140,40,.9)');
        fg.addColorStop(1,'rgba(190,40,20,.65)');
        c.fillStyle=fg;
        c.beginPath();
        c.moveTo(0,-7);c.quadraticCurveTo(3.4,-1.5,1.2,2.6);
        c.quadraticCurveTo(3.2,1.4,0,5.4);
        c.quadraticCurveTo(-3.2,1.4,-1.2,2.6);
        c.quadraticCurveTo(-3.4,-1.5,0,-7);
        c.closePath();c.fill();
        // 内炎
        c.fillStyle='rgba(255,246,200,.85)';
        c.beginPath();
        c.moveTo(0,-3.2);c.quadraticCurveTo(1.5,-.4,.5,1.5);
        c.quadraticCurveTo(1.3,.9,0,3.2);
        c.quadraticCurveTo(-1.3,.9,-.5,1.5);
        c.quadraticCurveTo(-1.5,-.4,0,-3.2);
        c.closePath();c.fill();
        c.restore();
      }
      c.restore();
    }
  }
  // tokens — draw icon images
  const toff=[{dx:-12,dy:-10},{dx:12,dy:-10},{dx:-12,dy:10},{dx:12,dy:10}];
  const tokenSize=20;
  rm.players.forEach((p,idx)=>{
    if(p.position==null) return;
    const overPos=tokenPosOverride&&tokenPosOverride[p.id]!=null?tokenPosOverride[p.id]:p.position;
    const ci=Math.min(overPos,rm.boardSize);
    const{x:cx,y:cy}=cells[ci];const o=toff[idx%4];const tx=cx+o.dx,ty=cy+o.dy;
    const isTurn=p.id===rm.currentTurnId;
    // 手番プレイヤーの駒は光をまとう
    if(isTurn){
      const gl=(Math.sin(boardT/300)+1)/2;
      const rg=c.createRadialGradient(tx,ty,2,tx,ty,tokenSize*(0.85+gl*0.3));
      rg.addColorStop(0,'rgba(242,183,5,'+(0.55+gl*0.3)+')');
      rg.addColorStop(0.5,'rgba(242,183,5,'+(0.18+gl*0.12)+')');
      rg.addColorStop(1,'transparent');
      c.fillStyle=rg;c.beginPath();c.arc(tx,ty,tokenSize*(0.85+gl*0.3),0,Math.PI*2);c.fill();
    }
    // icon image
    const iconKey=p.roleId&&ROLE_ICON[p.roleId]?ROLE_ICON[p.roleId]:null;
    const img=iconKey?tokenImgCache[iconKey]:null;
    if(img&&img.complete){
      c.save();
      c.beginPath();c.arc(tx,ty,tokenSize/2,0,Math.PI*2);c.clip();
      c.drawImage(img,tx-tokenSize/2,ty-tokenSize/2,tokenSize,tokenSize);
      c.restore();
    } else {
      c.beginPath();c.arc(tx,ty,tokenSize/2,0,Math.PI*2);
      c.fillStyle=p.incapacitatedTurns>0?'#555':p.color;c.fill();
      c.fillStyle='#fff';c.font='bold 9px sans-serif';c.textAlign='center';c.textBaseline='middle';
      c.fillText(p.name.charAt(0),tx,ty);
    }
    // border
    c.beginPath();c.arc(tx,ty,tokenSize/2+1,0,Math.PI*2);
    c.strokeStyle=isTurn?'#f2b705':'rgba(255,255,255,.75)';
    c.lineWidth=isTurn?2.5:1.5;c.stroke();
    if(isTurn){
      const gl=(Math.sin(boardT/300)+1)/2;
      c.beginPath();c.arc(tx,ty,tokenSize/2+4+gl*2,0,Math.PI*2);
      c.strokeStyle='rgba(242,183,5,'+(0.45-gl*0.2)+')';c.lineWidth=1.5;c.stroke();
    }
    if(p.incapacitatedTurns>0){c.globalAlpha=0.4;c.beginPath();c.arc(tx,ty,tokenSize/2,0,Math.PI*2);c.fillStyle='#000';c.fill();c.globalAlpha=1;}
    // 駒の上に小さくHPバーを表示
    if(p.maxHp>0){
      const bw=tokenSize+4,bh=3,bx=tx-bw/2,by=ty-tokenSize/2-6;
      const ratio=Math.max(0,Math.min(1,p.hp/p.maxHp));
      c.fillStyle='rgba(6,3,16,.82)';
      c.beginPath();c.roundRect?c.roundRect(bx-1,by-1,bw+2,bh+2,2):c.rect(bx-1,by-1,bw+2,bh+2);c.fill();
      c.fillStyle=ratio>.5?'#4ade80':(ratio>.25?'#f2b705':'#ef4576');
      c.beginPath();c.roundRect?c.roundRect(bx,by,bw*ratio,bh,1.5):c.rect(bx,by,bw*ratio,bh);c.fill();
    }
  });
}

const tokenImgCache={};
Object.entries(ROLE_ICON).forEach(([k,v])=>{
  const img=new Image();img.src='/img/'+v+'.png';tokenImgCache[v]=img;
});

// 駒の1マスずつ移動アニメーション
let pathBattleUI=false;

function animateTokenMove(playerId, fromPos, toPos, room, onStep, onDone){
  if(tokenAnim&&tokenAnim.timer) clearTimeout(tokenAnim.timer);
  displayPositions[playerId]=fromPos; // 開始位置を確定させる
  const dir=toPos>fromPos?1:(toPos<fromPos?-1:0);
  if(dir===0){if(onDone)onDone();return;}
  let cur=fromPos;
  tokenAnim={playerId, from:fromPos, to:toPos, current:cur, timer:null};

  function step(){
    cur+=dir;
    tokenAnim.current=cur;
    displayPositions[playerId]=cur; // 一歩ごとに「信頼できる表示位置」を更新
    ensureDisplayPositionsInit(currentRoom);
    drawMap($('mapCanvas'),currentRoom,currentDisplayOverrides());
    sfxStep();
    // onStepでtrueが返ったら一時停止（戦闘選択）
    if(onStep && onStep(cur)){
      tokenAnim.paused=true;
      tokenAnim.resumeFn=()=>{
        if(cur===toPos){tokenAnim=null;if(onDone)onDone();}
        else{tokenAnim.timer=setTimeout(step,450);}
      };
      return;
    }
    if(cur===toPos){tokenAnim=null;if(onDone)onDone();}
    else{tokenAnim.timer=setTimeout(step,450);}
  }
  tokenAnim.timer=setTimeout(step,300);
}

function showTargetPicker(pw){
  const me=currentRoom?currentRoom.players.find(p=>p.id===myId):null;
  if(!me){return;}
  const targets=currentRoom.players.filter(p=>p.id!==myId&&p.position===me.position&&!p.finished&&p.incapacitatedTurns===0);
  const bt=$('battleTargets');bt.innerHTML='';
  if(targets.length===0){
    const msg=document.createElement('div');
    msg.style.cssText='font-size:.82em;color:var(--dim);margin-bottom:4px;';
    msg.textContent='同じマスに対象がいません';
    bt.appendChild(msg);
    setTimeout(()=>{bt.innerHTML='';},1500);
    return;
  }
  const label=document.createElement('div');
  label.style.cssText='font-size:.82em;color:var(--vio);margin-bottom:4px;font-weight:700;';
  label.textContent='「'+pw.name+'」の対象を選んでください';
  bt.appendChild(label);
  targets.forEach(t=>{
    const b=document.createElement('button');
    b.textContent=t.name+'を対象にする';
    b.onclick=()=>{
      socket.emit('useAbility',{powerId:pw.lineId,targetId:t.id});
      bt.innerHTML='';
    };
    bt.appendChild(b);
  });
  const cancel=document.createElement('button');
  cancel.className='dan';
  cancel.textContent='キャンセル';
  cancel.onclick=()=>{bt.innerHTML='';};
  bt.appendChild(cancel);
}

function showCopyPicker(pw){
  const me=currentRoom?currentRoom.players.find(p=>p.id===myId):null;
  if(!me){return;}
  const history=((currentRoom&&currentRoom.abilityHistoryByPosition&&currentRoom.abilityHistoryByPosition[me.position])||[]).filter(h=>h.ownerId!==myId);
  const bt=$('battleTargets');bt.innerHTML='';
  if(history.length===0){
    const msg=document.createElement('div');
    msg.style.cssText='font-size:.82em;color:var(--dim);margin-bottom:4px;';
    msg.textContent='このマスでコピーできる超能力の使用履歴がありません';
    bt.appendChild(msg);
    setTimeout(()=>{bt.innerHTML='';},1800);
    return;
  }
  const label=document.createElement('div');
  label.style.cssText='font-size:.82em;color:var(--vio);margin-bottom:4px;font-weight:700;';
  label.textContent='「'+pw.name+'」— コピーする超能力を選んでください';
  bt.appendChild(label);
  // 同じ超能力の重複表示を避け、直近の使用のみを表示する
  const seen=new Set();
  const uniqueHistory=[];
  for(let i=history.length-1;i>=0;i--){
    const h=history[i];
    const key=h.ownerId+'|'+h.name;
    if(seen.has(key)) continue;
    seen.add(key);
    uniqueHistory.push(h);
  }
  uniqueHistory.forEach(h=>{
    const b=document.createElement('button');
    b.style.textAlign='left';
    b.innerHTML='<b>'+h.name+'</b> <span style="font-size:.7em;color:var(--dim);">('+h.ownerName+'が使用)</span><br><span style="font-size:.72em;color:var(--dim);">'+h.description+'</span>';
    b.onclick=()=>{
      socket.emit('useAbility',{powerId:pw.lineId,choiceId:h.id});
      bt.innerHTML='';
    };
    bt.appendChild(b);
  });
  const cancel=document.createElement('button');
  cancel.className='dan';
  cancel.textContent='キャンセル';
  cancel.onclick=()=>{bt.innerHTML='';};
  bt.appendChild(cancel);
}

function showPathBattleChoice(pos, opponents, outerDone){
  const bt=$('battleTargets');bt.innerHTML='';
  pathBattleUI=true;
  $('endTurnBtn').style.display='none';
  const label=document.createElement('div');
  label.style.cssText='font-size:.82em;color:var(--gold);margin-bottom:4px;font-weight:700;';
  label.textContent='マス'+pos+'に他プレイヤーがいます。戦闘しますか？';
  bt.appendChild(label);
  opponents.forEach(o=>{
    const b=document.createElement('button');b.className='dan';b.textContent=o.name+'に戦闘を仕掛ける';
    b.onclick=()=>{
      pathBattleUI=false;bt.innerHTML='';
      // 現在位置を確定させてから移動タスクを終了する（駒のワープ防止）
      if(tokenAnim){if(tokenAnim.timer) clearTimeout(tokenAnim.timer);tokenAnim=null;}
      commitDisplayPosition(myId,pos);
      drawMap($('mapCanvas'),currentRoom,currentDisplayOverrides());
      socket.emit('battleOnPath',{position:pos,opponentId:o.id});
      // 移動タスクを完了扱いにし、以降の戦闘演出は独立したキュータスクとして進行させる
      outerDone();
    };
    bt.appendChild(b);
  });
  const skip=document.createElement('button');skip.textContent='スルーして進む';
  skip.onclick=()=>{
    pathBattleUI=false;bt.innerHTML='';
    if(tokenAnim&&tokenAnim.resumeFn) tokenAnim.resumeFn();
  };
  bt.appendChild(skip);
}

// 超能力発動アニメーション（短いバナー）は下部でsetImage対応版を定義
/* ===== 盤面アニメーション基盤 =====
   canvasは静止画なので、常時再描画するループを回して脈動や炎を animate する */
let boardT=0;              // 経過時間(ms)
let boardRafId=null;
let boardLastDraw=0;
function startBoardLoop(){
  if(boardRafId!=null) return;
  const step=(ts)=>{
    boardRafId=requestAnimationFrame(step);
    boardT=ts;
    // 駒の移動アニメーション中は既存処理が描画するので二重描画しない
    if(tokenAnim) return;
    if(!currentRoom||!currentRoom.players) return;
    if(ts-boardLastDraw<50) return; // 20fpsで十分
    boardLastDraw=ts;
    const cv=$('mapCanvas');
    if(!cv||cv.offsetParent===null) return;
    drawMap(cv,currentRoom,currentDisplayOverrides());
  };
  boardRafId=requestAnimationFrame(step);
}
function stopBoardLoop(){ if(boardRafId!=null){cancelAnimationFrame(boardRafId);boardRafId=null;} }

function drawTer(c,g){c.globalAlpha=.5;switch(g){
  case'grass':for(let i=-1;i<=1;i++){c.strokeStyle='#7ac060';c.lineWidth=1;c.beginPath();c.moveTo(i*5,-1);c.quadraticCurveTo(i*5-1,-9,i*5+2,-12);c.stroke();}break;
  case'tree':c.fillStyle='#2a7030';c.beginPath();c.moveTo(0,-13);c.lineTo(-7,-1);c.lineTo(7,-1);c.closePath();c.fill();c.beginPath();c.moveTo(0,-9);c.lineTo(-5,1);c.lineTo(5,1);c.closePath();c.fill();c.fillStyle='#6a4a30';c.fillRect(-1.2,1,2.4,5);break;
  case'mtn':c.fillStyle='#7a7088';c.beginPath();c.moveTo(0,-12);c.lineTo(-10,3);c.lineTo(10,3);c.closePath();c.fill();c.fillStyle='#b8b0c8';c.beginPath();c.moveTo(0,-12);c.lineTo(-3,-5);c.lineTo(3,-5);c.closePath();c.fill();break;
  case'water':c.strokeStyle='#5a9ed0';c.lineWidth=1.2;c.lineCap='round';for(let j=-1;j<=1;j++){c.beginPath();c.moveTo(-8,j*5);c.quadraticCurveTo(-2,j*5-3,0,j*5);c.quadraticCurveTo(2,j*5+3,8,j*5);c.stroke();}break;
  case'ruin':c.fillStyle='#8a7a98';c.fillRect(-7,-7,3.5,14);c.fillRect(3.5,-7,3.5,12);c.fillRect(-7,-9,14,2.5);break;
  case'cave':c.fillStyle='#3a3248';c.beginPath();c.arc(0,0,8,Math.PI,0);c.lineTo(8,5);c.lineTo(-8,5);c.closePath();c.fill();c.fillStyle='#16101e';c.beginPath();c.arc(0,2,4,Math.PI,0);c.lineTo(4,5);c.lineTo(-4,5);c.closePath();c.fill();break;
}c.globalAlpha=1;}
function drawStart(c){c.fillStyle='rgba(45,212,191,.45)';c.beginPath();c.arc(0,-3,6,0,Math.PI*2);c.fill();c.strokeStyle='#2dd4bf';c.lineWidth=1.3;c.beginPath();c.moveTo(-2,-5);c.lineTo(4,-3);c.lineTo(-2,-1);c.closePath();c.stroke();}
function drawGoal(c){c.fillStyle='rgba(242,183,5,.55)';c.beginPath();for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,rr=i%2===0?9:3.5;if(i===0)c.moveTo(rr*Math.cos(a),rr*Math.sin(a)-3);else c.lineTo(rr*Math.cos(a),rr*Math.sin(a)-3);}c.closePath();c.fill();}

function renderRankBoard(r){

    return (b.position||0)-(a.position||0);
  });

    const remain=Math.max(0,(r.boardSize||0)-(p.position||0));

    h+='<div class="rank-row r'+(i+1)+(p.id===myId?' me-row':'')+(p.finished?' goal':'')+'">'
      +'<span class="rk-no">'+(i+1)+'</span>'
      +'<span class="rk-dot" style="background:'+p.color+';color:'+p.color+'"></span>'
      +'<span class="rk-name">'+escHtml(p.name)+'</span>'
      +'<span class="rk-pos">'+posTxt+'</span></div>';
  });
  box.innerHTML=h;
}

// 次に手番が回るプレイヤーを予告する
function renderNextTurn(r){
  const order=r.turnOrder||[];
  if(!order.length||!r.currentTurnId){ $('nextTurnBox').style.display='none'; return; }
  const cur=order.indexOf(r.currentTurnId);
  if(cur<0){ $('nextTurnBox').style.display='none'; return; }
  // 行動不能・ゴール済みを飛ばして、次に実際に動く人を探す
  let nx=null;
  for(let k=1;k<=order.length;k++){
    const cand=r.players.find(p=>p.id===order[(cur+k)%order.length]);
    if(cand&&!cand.finished&&!(cand.incapacitatedTurns>0)){ nx=cand; break; }
  }
  if(!nx){ $('nextTurnBox').style.display='none'; return; }
  $('nextTurnBox').style.display='flex';
  $('nextTurnName').textContent=nx.name;
}
